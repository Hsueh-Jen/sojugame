<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soju 大冒險 | Soju's Adventure</title>
  <meta name="description" content="控制法鬥犬 Soju 穿越客廳、打倒小怪、救出主人的橫向捲軸像素動作遊戲！">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1220;
      display: flex; flex-direction: column;

      display: block;

    }
    #restartBtn {
      display: none;
      position: absolute;

      transform: translateX(-50%);
      padding: 14px 44px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 22px; font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, #e03060 0%, #a020c0 100%);
      border: none; border-radius: 8px;

      text-shadow: 0 0 20px rgba(180, 120, 255, 0.8);

    #loadingScreen .bar-wrap {

    }
    #loadingBar {
      height: 100%; width: 0%;

    }
    #loadingText { color: rgba(255,255,255,0.5); font-size: 14px; }

</head>
<body>

</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// 1. 全域常數

const ATTACK_COOLDOWN = 22;
const HURT_IFRAMES = 80;

// Spritesheet 切圖座標
const SOJU_FRAMES = {
  idle: { dur: 14, frames: [
    { sx: 40, sy: 125, sw: 460, sh: 365 },

  ]},

  ]},
  bite: { dur: 4, frames: [
    { sx: 40, sy: 125, sw: 460, sh: 365 },
    { sx: 560, sy: 125, sw: 460, sh: 365 },
    { sx: 40, sy: 555, sw: 460, sh: 345 },
    { sx: 560, sy: 555, sw: 460, sh: 345 },
  ]},
};
const OWNER_FRAME = { sx: 410, sy: 30, sw: 280, sh: 890 };

// ═══════════════════════════════════════════════════════════
// 2. 素材載入器
// ═══════════════════════════════════════════════════════════
const assets = {};
let assetsLoaded = 0;
const TOTAL_ASSETS = 24;

function updateLoadingBar() {
  assetsLoaded++;
  document.getElementById('loadingBar').style.width = (assetsLoaded / TOTAL_ASSETS * 100) + '%';
}

function loadImage(name, src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { assets[name] = img; updateLoadingBar(); resolve(); };
    img.onerror = () => { console.warn('Failed to load:', src); updateLoadingBar(); resolve(); };
    img.src = src;
  });
}

function loadWithChromaKey(name, src, targetBg, tol = 26) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const oc = document.createElement('canvas');
      oc.width = img.width; oc.height = img.height;
      const octx = oc.getContext('2d');
      octx.drawImage(img, 0, 0);
      const d = octx.getImageData(0, 0, img.width, img.height);
      const px = d.data;
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i], g = px[i+1], b = px[i+2];
        const isGray = Math.abs(r-g) <= 14 && Math.abs(g-b) <= 14;
        const matchBg = Math.abs(r-targetBg[0]) <= tol && Math.abs(g-targetBg[1]) <= tol && Math.abs(b-targetBg[2]) <= tol;
        if (isGray && matchBg) px[i+3] = 0;
      }
      octx.putImageData(d, 0, 0);
      assets[name] = oc;
      updateLoadingBar();
      resolve();
    };
    img.onerror = () => { updateLoadingBar(); resolve(); };
    img.src = src;
  });
}

async function loadAllAssets() {
  await Promise.all([
    loadWithChromaKey('idle',  'imgs/idle.jpeg',  [135,135,135]),
    loadWithChromaKey('run',   'imgs/run.jpeg',   [133,133,133]),
    loadWithChromaKey('jump',  'imgs/jump.jpeg',  [129,129,129]),
    loadWithChromaKey('bite',  'imgs/bite.jpeg',  [124,124,124]),
    loadWithChromaKey('owner', 'imgs/owner.jpeg', [123,123,123]),
    loadImage('slipper',       'imgs/slipper.png'),
    loadImage('dyson',         'imgs/dyson.png'),
    loadImage('ball',          'imgs/ball.png'),
    loadImage('boss_cloaked',  'imgs/boss_cloaked.png'),
    loadImage('boss_revealed', 'imgs/boss_revealed.png'),
    loadImage('boss_droplet',  'imgs/boss_droplet.png'),
    loadImage('boss_shockwave','imgs/boss_shockwave.png'),
    loadImage('bg_livingroom', 'imgs/bg_livingroom.jpg'),
    loadImage('floor',         'imgs/floor.png'),
    loadImage('sofa',          'imgs/sofa.png'),
    loadImage('table',         'imgs/table.png'),
    loadImage('toybox',        'imgs/toybox.png'),
    loadImage('cage',          'imgs/cage.png'),
    loadImage('decor_bowl',    'imgs/decor_bowl.png'),
    loadImage('decor_snack',   'imgs/decor_snack.png'),
    loadImage('decor_plant',   'imgs/decor_plant.png'),
    loadImage('gate',          'imgs/gate.png'),
    loadImage('heart_full',    'imgs/heart_full.png'),
    loadImage('heart_empty',   'imgs/heart_empty.png'),
  ]);
}

// ═══════════════════════════════════════════════════════════
// 3. 音效系統
// ═══════════════════════════════════════════════════════════
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function tone(type, freqStart, freqEnd, duration, vol = 0.18) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.start(); osc.stop(audioCtx.currentTime + duration + 0.01);
}
const SFX = {
  jump:    () => tone('square',  440, 880, 0.12),
  bite:    () => tone('sawtooth',200,  70, 0.07),
  hurt:    () => tone('sawtooth',320, 110, 0.22),
  kill:    () => tone('square',  500, 900, 0.08),
  bosshit: () => tone('square',  160,  95, 0.16),
};
const NOTE_FREQ = {C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,Bb4:466.16,C5:523.25};
const BIRTHDAY = [
  ['C4',.75],['C4',.25],['D4',1],['C4',1],['F4',1],['E4',2],
  ['C4',.75],['C4',.25],['D4',1],['C4',1],['G4',1],['F4',2],
  ['C4',.75],['C4',.25],['C5',1],['A4',1],['F4',1],['E4',1],['D4',2],
  ['Bb4',.75],['Bb4',.25],['A4',1],['F4',1],['G4',1],['F4',2],
];
let birthdayPlayed = false;
function playBirthday() {
  if (!audioCtx || birthdayPlayed) return;
  birthdayPlayed = true;
  let t = audioCtx.currentTime + 0.1;
  const beat = 0.42;
  for (const [note, len] of BIRTHDAY) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.value = NOTE_FREQ[note];
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + len * beat * 0.9);
    osc.start(t); osc.stop(t + len * beat);
    t += len * beat;
  }
  // loop once more
  t += 0.5;
  for (const [note, len] of BIRTHDAY) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.value = NOTE_FREQ[note];
    g.gain.setValueAtTime(0.14, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + len * beat * 0.9);
    osc.start(t); osc.stop(t + len * beat);
    t += len * beat;
  }
}

// ═══════════════════════════════════════════════════════════
// 4. 繪製工具函式
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

function drawSprite(img, frame, dx, dy, dw, dh, flipX = false) {
  if (!img) return;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (flipX) {
    ctx.translate(Math.round(dx + dw), Math.round(dy));
    ctx.scale(-1, 1);
    ctx.drawImage(img, frame.sx, frame.sy, frame.sw, frame.sh, 0, 0, dw, dh);
  } else {
    ctx.drawImage(img, frame.sx, frame.sy, frame.sw, frame.sh, Math.round(dx), Math.round(dy), dw, dh);
  }
  ctx.restore();
}

function drawImg(img, dx, dy, dw, dh, flipX = false) {
  if (!img) return;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (flipX) {
    ctx.translate(Math.round(dx + dw), Math.round(dy));
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0, dw, dh);
  } else {
    ctx.drawImage(img, Math.round(dx), Math.round(dy), dw, dh);
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════
// 5. 關卡資料
// ═══════════════════════════════════════════════════════════
const PLATFORMS = [
  { x: 0,       y: GROUND_Y, w: PIT_START,             h: 80, sprite: 'floor' },
  { x: PIT_END, y: GROUND_Y, w: LEVEL_WIDTH - PIT_END, h: 80, sprite: 'floor' },
  { x: 230,     y: 390,      w: 190, h: 70, sprite: 'sofa' },
  { x: 480,     y: 410,      w: 120, h: 50, sprite: 'table' },
  { x: 1350,    y: 395,      w: 150, h: 65, sprite: 'toybox' },
];

const DECOR_DEFS = [
  { type: 'decor_bowl',  x: 60,     y: GROUND_Y - 26, w: 40,  h: 26  },
  { type: 'decor_snack', x: 150,    y: GROUND_Y - 36, w: 36,  h: 36  },
  { type: 'decor_plant', x: 900,    y: GROUND_Y - 64, w: 48,  h: 64  },
  { type: 'decor_plant', x: 2050,   y: GROUND_Y - 64, w: 48,  h: 64  },
  { type: 'decor_plant', x: 2700,   y: GROUND_Y - 64, w: 48,  h: 64  },
  { type: 'gate',        x: GATE_X, y: GROUND_Y - 120, w: 80, h: 120 },
];

function makeEnemyDefs() {
  return [
    { type:'slipper', x:120,  y:GROUND_Y-32, w:48, h:32, dir:1, range:[100, 300],  speed:1.3, pause:0, baseY:GROUND_Y-32 },
    { type:'slipper', x:300,  y:390-32,      w:48, h:32, dir:1, range:[250, 405],  speed:1.3, pause:0, baseY:390-32 },
    { type:'dyson',   x:600,  y:GROUND_Y-66, w:44, h:66, dir:1, range:[560, 820],  speed:3.9, pause:0, baseY:GROUND_Y-66 },
    { type:'ball',    x:1150, y:GROUND_Y-32, w:32, h:32, vy:0,                              baseY:GROUND_Y-32 },
    { type:'slipper', x:1380, y:395-32,      w:48, h:32, dir:1, range:[1360,1485], speed:1.3, pause:0, baseY:395-32 },
    { type:'dyson',   x:1700, y:GROUND_Y-66, w:44, h:66, dir:1, range:[1650,1950], speed:3.9, pause:0, baseY:GROUND_Y-66 },
    { type:'ball',    x:2050, y:GROUND_Y-32, w:32, h:32, vy:0,                              baseY:GROUND_Y-32 },
    { type:'slipper', x:2200, y:GROUND_Y-32, w:48, h:32, dir:1, range:[2150,2350], speed:1.3, pause:0, baseY:GROUND_Y-32 },
    { type:'slipper', x:2950, y:GROUND_Y-32, w:48, h:32, dir:1, range:[2900,3060], speed:1.3, pause:0, baseY:GROUND_Y-32 },
  ];
}

// ═══════════════════════════════════════════════════════════
// 6. 輸入管理
// ═══════════════════════════════════════════════════════════
const keys = {};
const justPressed = {};
let gameState = 'LOADING';

window.addEventListener('keydown', (e) => {
  if (gameState === 'WIN') return;
  const k = e.key === ' ' ? 'Space' : e.key;
  if (!keys[k]) { justPressed[k] = true; }
  keys[k] = true;
  ensureAudio();
  e.preventDefault();
});
window.addEventListener('keyup', (e) => {
  const k = e.key === ' ' ? 'Space' : e.key;
  keys[k] = false;
});
function clearJustPressed() {
  for (const k in justPressed) delete justPressed[k];
}

// ═══════════════════════════════════════════════════════════
// 7. 遊戲狀態
// ═══════════════════════════════════════════════════════════
let state = 'TITLE';
let storyScene = 0;
let storyTick = 0;
let bossIntroTimer = 0;

let player = null;
let enemies = [];
let projectiles = [];
let shockwaves = [];
let boss = null;
let killCount = 0;
let cameraX = 0;

// 閃爍 UI
let titleTick = 0;
let winTick = 0;

function makePlayer() {
  return {
    x: 60, y: GROUND_Y - PLAYER_HIT_H,
    vx: 0, vy: 0,
    onGround: false,
    facing: 1, // 1=right, -1=left
    hearts: 3,
    hurtFrames: 0,
    attackFrames: 0,
    attackCooldown: 0,
    anim: 'idle', animTick: 0, animFrame: 0,
  };
}

function makeBoss() {
  return {
    x: 700, y: GROUND_Y - 150,
    w: 100, h: 140,
    hp: 5, maxHp: 5,
    phase: 'idle',
    timer: 40,
    lastPattern: null,
    hitCooldown: 0,
    revealed: false,
    facing: -1,
    vy: 0, onGround: true,
    summonedEnemies: [],
  };
}

function resetLevel() {
  player = makePlayer();
  enemies = makeEnemyDefs().map(d => Object.assign({ alive: true, animTick: 0 }, d));
  projectiles = [];
  shockwaves = [];
  boss = null;
  killCount = 0;
  cameraX = 0;
  birthdayPlayed = false;
}

// ═══════════════════════════════════════════════════════════
// 8. 碰撞工具
// ═══════════════════════════════════════════════════════════
function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

function platformLand(p) {
  if (p.vy < 0) return;
  const px = p.x, py = p.y + PLAYER_HIT_H;
  for (const plat of PLATFORMS) {
    if (px + PLAYER_HIT_W > plat.x && px < plat.x + plat.w) {
      const prevBottom = py - p.vy;
      if (prevBottom <= plat.y && py >= plat.y) {
        p.y = plat.y - PLAYER_HIT_H;
        p.vy = 0;
        p.onGround = true;
        return;
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════
// 9. 更新邏輯
// ═══════════════════════════════════════════════════════════

function updatePlayer() {
  const p = player;
  // 移動
  let moving = false;
  if (keys['ArrowLeft'] || keys['a']) {
    p.vx = -MOVE_SPEED; p.facing = -1; moving = true;
  } else if (keys['ArrowRight'] || keys['d']) {
    p.vx = MOVE_SPEED; p.facing = 1; moving = true;
  } else {
    p.vx = 0;
  }

  // 跳躍
  if ((justPressed['ArrowUp'] || justPressed['w']) && p.onGround) {
    p.vy = JUMP_V;
    p.onGround = false;
    SFX.jump();
  }

  // 攻擊
  if (justPressed['Space'] && p.attackCooldown <= 0) {
    p.attackFrames = ATTACK_ACTIVE;
    p.attackCooldown = ATTACK_COOLDOWN;
    SFX.bite();
  }
  if (p.attackFrames > 0) p.attackFrames--;
  if (p.attackCooldown > 0) p.attackCooldown--;
  if (p.hurtFrames > 0) p.hurtFrames--;

  // 物理
  p.vy += GRAVITY;
  p.x += p.vx;
  p.y += p.vy;

  // 邊界
  p.x = Math.max(0, Math.min(LEVEL_WIDTH - PLAYER_HIT_W, p.x));

  // 平台碰撞
  p.onGround = false;
  if (p.y + PLAYER_HIT_H > GROUND_Y) {
    // 黑暗玩具坑
    const centerX = p.x + PLAYER_HIT_W / 2;
    if (centerX > PIT_START && centerX < PIT_END) {
      // 掉坑
      hurtPlayer();
      p.x = PIT_START - 50;
      p.y = GROUND_Y - PLAYER_HIT_H;
      p.vy = 0;
      p.onGround = true;
    } else {
      p.y = GROUND_Y - PLAYER_HIT_H;
      p.vy = 0;
      p.onGround = true;
    }
  }
  platformLand(p);

  // 動畫狀態
  let newAnim = 'idle';
  if (p.attackFrames > 0) newAnim = 'bite';
  else if (!p.onGround) newAnim = 'jump';
  else if (moving) newAnim = 'run';

  if (newAnim !== p.anim) { p.anim = newAnim; p.animTick = 0; p.animFrame = 0; }
  const animDef = SOJU_FRAMES[p.anim];
  p.animTick++;
  if (p.animTick >= animDef.dur) { p.animTick = 0; p.animFrame = (p.animFrame + 1) % animDef.frames.length; }
}

function hurtPlayer() {
  const p = player;
  if (p.hurtFrames > 0) return;
  p.hearts--;
  p.hurtFrames = HURT_IFRAMES;
  SFX.hurt();
  if (p.hearts <= 0) {
    state = 'LOSE';
    document.getElementById('restartBtn').style.display = 'block';
  }
}

function updateEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.type === 'slipper') {
      e.x += e.speed * e.dir;
      if (e.x < e.range[0]) { e.x = e.range[0]; e.dir = 1; }
      if (e.x + e.w > e.range[1]) { e.x = e.range[1] - e.w; e.dir = -1; }
    } else if (e.type === 'dyson') {
      if (e.pause > 0) { e.pause--; }
      else {
        e.x += e.speed * e.dir;
        if (e.x < e.range[0]) { e.x = e.range[0]; e.dir = 1; e.pause = 26; }
        if (e.x + e.w > e.range[1]) { e.x = e.range[1] - e.w; e.dir = -1; e.pause = 26; }
      }
    } else if (e.type === 'ball') {
      e.vy = (e.vy || 0) + GRAVITY * 0.55;
      e.y += e.vy;
      if (e.y >= e.baseY) { e.y = e.baseY; e.vy = -9.2; }
    }

    // 檢查玩家撲咬攻擊
    if (player.attackFrames > 0) {
      const hitX = player.facing === 1 ? player.x + PLAYER_HIT_W : player.x - ATTACK_W;
      const hitY = player.y + 4;
      if (aabb(hitX, hitY, ATTACK_W, ATTACK_H, e.x, e.y, e.w, e.h)) {
        e.alive = false;
        killCount++;
        SFX.kill();
      }
    }

    // 玩家碰撞傷害
    if (aabb(player.x, player.y, PLAYER_HIT_W, PLAYER_HIT_H, e.x, e.y, e.w, e.h)) {
      hurtPlayer();
    }
  }
}

function updateBoss() {
  const b = boss;
  if (!b || b.phase === 'dead') return;
  if (b.hitCooldown > 0) b.hitCooldown--;

  // 攻擊玩家 hitbox
  if (aabb(player.x, player.y, PLAYER_HIT_W, PLAYER_HIT_H, b.x, b.y, b.w, b.h)) {
    hurtPlayer();
  }

  // Boss 被咬
  if (player.attackFrames > 0 && b.hitCooldown <= 0) {
    const hitX = player.facing === 1 ? player.x + PLAYER_HIT_W : player.x - ATTACK_W;
    const hitY = player.y + 4;
    if (aabb(hitX, hitY, ATTACK_W, ATTACK_H, b.x, b.y, b.w, b.h)) {
      b.hp--;
      b.hitCooldown = 34;
      SFX.bosshit();
      if (b.hp <= 0) {
        b.phase = 'dead';
        b.timer = 90;
        projectiles = [];
        shockwaves = [];
        for (const e of b.summonedEnemies) e.alive = false;
      }
    }
  }

  b.timer--;
  if (b.phase === 'dead') {
    if (b.timer <= 0) { state = 'WIN'; winTick = 0; playBirthday(); }
    return;
  }

  if (b.phase === 'idle') {
    if (b.timer <= 0) {
      b.phase = 'telegraph';
      b.timer = 40;
      // 選招（避免連續）
      const patterns = ['spray', 'slam', 'summon'];
      const avail = patterns.filter(p => p !== b.lastPattern);
      b.nextPattern = avail[Math.floor(Math.random() * avail.length)];
      b.lastPattern = b.nextPattern;
    }
  } else if (b.phase === 'telegraph') {
    if (b.timer <= 0) {
      b.phase = 'action';
      b.timer = b.nextPattern === 'spray' ? 60 : b.nextPattern === 'slam' ? 80 : 50;
      b.actionTick = 0;
      b.sprayCount = 0;
    }
  } else if (b.phase === 'action') {
    b.actionTick++;
    if (b.nextPattern === 'spray') {
      // 每 18 tick 噴一顆
      if (b.actionTick % 18 === 1 && b.sprayCount < 3) {
        b.sprayCount++;
        const dir = player.x < b.x ? -1 : 1;
        projectiles.push({ x: b.x + b.w/2, y: GROUND_Y - 70, vx: dir * 4.6, w: 16, h: 16, alive: true });
      }
    } else if (b.nextPattern === 'slam') {
      if (b.actionTick === 1) {
        b.vy = -9;
        b.onGround = false;
      }
      b.vy += 0.5;
      b.y += b.vy;
      if (b.y >= GROUND_Y - b.h) {
        b.y = GROUND_Y - b.h;
        b.vy = 0;
        if (!b.onGround) {
          b.onGround = true;
          shockwaves.push({ x: b.x - 80, y: GROUND_Y - 18, vx: -5.2, w: 48, h: 18, alive: true });
          shockwaves.push({ x: b.x + b.w, y: GROUND_Y - 18, vx: 5.2, w: 48, h: 18, alive: true });
        }
      }
    } else if (b.nextPattern === 'summon') {
      if (b.actionTick === 10) {
        const ex = player.x < 480 ? 880 : 80;
        const et = Math.random() < 0.5 ? 'slipper' : 'ball';
        const ne = {
          type: et, x: ex, y: GROUND_Y - 32, w: et==='slipper'?48:32, h: 32,
          dir: ex > 480 ? -1 : 1, range: [50, 900], speed: 1.5, pause: 0, alive: true,
          vy: 0, baseY: GROUND_Y - 32, animTick: 0,
        };
        enemies.push(ne);
        b.summonedEnemies.push(ne);
      }
    }
    if (b.timer <= 0) { b.phase = 'recover'; b.timer = 70; b.onGround = true; }
  } else if (b.phase === 'recover') {
    if (b.timer <= 0) { b.phase = 'idle'; b.timer = 30 + Math.floor(Math.random() * 10); }
  }

  // Boss 面向玩家
  b.facing = player.x < b.x + b.w/2 ? -1 : 1;

  // 彈幕更新
  for (const p of projectiles) {
    p.x += p.vx;
    if (p.x < 0 || p.x > W) p.alive = false;
    if (aabb(player.x, player.y, PLAYER_HIT_W, PLAYER_HIT_H, p.x, p.y, p.w, p.h)) {
      p.alive = false; hurtPlayer();
    }
  }
  projectiles = projectiles.filter(p => p.alive);

  // 震波更新
  for (const s of shockwaves) {
    s.x += s.vx;
    if (s.x < -50 || s.x > W + 50) s.alive = false;
    if (aabb(player.x, player.y, PLAYER_HIT_W, PLAYER_HIT_H, s.x, s.y, s.w, s.h)) {
      s.alive = false; hurtPlayer();
    }
  }
  shockwaves = shockwaves.filter(s => s.alive);

  // 召喚小怪也要更新
  updateEnemies();
}

function updateLevel() {
  updatePlayer();
  updateEnemies();
  // 鏡頭跟隨
  const targetCam = player.x - W / 2 + PLAYER_HIT_W / 2;
  cameraX = Math.max(0, Math.min(LEVEL_WIDTH - W, targetCam));
  // 終點
  if (player.x > GATE_X) {
    state = 'BOSS_INTRO';
    bossIntroTimer = 0;
    boss = makeBoss();
    player.x = 60;
    player.y = GROUND_Y - PLAYER_HIT_H;
    player.vx = 0; player.vy = 0;
  }
}

function updateBossIntro() {
  bossIntroTimer++;
  if (bossIntroTimer === 70) boss.revealed = true;
  if (bossIntroTimer > 160 || justPressed['Space']) { state = 'BOSS'; }
}

// 10. 渲染
// ═══════════════════════════════════════════════════════════

function renderBackground() {
  const bg = assets['bg_livingroom'];
  if (bg) {
    // 背景視差：以一半速度捲動
    const bgScale = H / bg.height;
    const bgW = bg.width * bgScale;
    const offset = -(cameraX * 0.4) % bgW;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(bg, offset, 0, bgW, H);
    if (offset + bgW < W) ctx.drawImage(bg, offset + bgW, 0, bgW, H);
  } else {
    ctx.fillStyle = '#c8a870';
    ctx.fillRect(0, 0, W, H);
  }
}

function renderPlatforms() {
  for (const p of PLATFORMS) {
    const sx = p.x - cameraX;
    if (sx > W || sx + p.w < 0) continue;
    const img = assets[p.sprite];
    if (img) {
      // 拼貼
      const tileW = p.w; const tileH = p.h;
      ctx.drawImage(img, Math.round(sx), p.y, tileW, tileH);
    } else {
      ctx.fillStyle = '#8B5E3C';
      ctx.fillRect(Math.round(sx), p.y, p.w, p.h);
    }
  }
}

function renderDecor() {
  for (const d of DECOR_DEFS) {
    const sx = d.x - cameraX;
    if (sx > W || sx + d.w < 0) continue;
    drawImg(assets[d.type], sx, d.y, d.w, d.h);
  }
}

function renderPit() {
  const sx = PIT_START - cameraX;
  if (sx < W && sx + (PIT_END - PIT_START) > 0) {
    const pw = PIT_END - PIT_START;
    ctx.fillStyle = '#0a0614';
    ctx.fillRect(Math.round(sx), GROUND_Y, pw, H - GROUND_Y);
    // 坑邊緣
    ctx.fillStyle = '#1a1030';
    ctx.fillRect(Math.round(sx), GROUND_Y, pw, 10);
    // 坑裡散落玩具（裝飾）
    ctx.font = '22px serif';
    ctx.fillText('🎮', Math.round(sx) + 10, GROUND_Y + 40);
    ctx.fillText('🧸', Math.round(sx) + 50, GROUND_Y + 55);
  }
}

function renderEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    const sx = e.x - cameraX;
    if (sx > W + 50 || sx + e.w < -50) continue;
    const img = assets[e.type];
    const flipX = e.dir ? e.dir < 0 : false;
    drawImg(img, sx, e.y, e.w, e.h, flipX);
  }
}

function renderPlayer() {
  const p = player;
  const px = p.x - cameraX - (PLAYER_DRAW_W - PLAYER_HIT_W) / 2;
  const py = p.y - (PLAYER_DRAW_H - PLAYER_HIT_H);

  // 無敵閃爍（每 6 frame 閃一次）
  if (p.hurtFrames > 0 && Math.floor(p.hurtFrames / 6) % 2 === 0) {
    ctx.globalAlpha = 0.35;
  }

  const animDef = SOJU_FRAMES[p.anim];
  const frame = animDef.frames[p.animFrame];
  const img = assets[p.anim];
  drawSprite(img, frame, px, py, PLAYER_DRAW_W, PLAYER_DRAW_H, p.facing < 0);

  ctx.globalAlpha = 1;

  // 攻擊 hitbox 視覺提示（僅除錯用，正式不顯示）
  // if (p.attackFrames > 0) { ctx.strokeStyle = 'red'; ctx.strokeRect(...); }
}

function renderBossCreature() {
  const b = boss;
  if (!b) return;
  const bw = 120, bh = 150;
  const bx = b.x - (bw - b.w) / 2;
  const by = b.y - (bh - b.h);
  const img = b.revealed ? assets['boss_revealed'] : assets['boss_cloaked'];

  // telegraph 抖動
  let shake = 0;
  if (b.phase === 'telegraph') {
    shake = Math.sin(bossIntroTimer * 0.8 + Date.now() * 0.02) * 3;
  }
  // dead 下沉
  const deadSink = b.phase === 'dead' ? Math.min((90 - b.timer) * 0.5, 30) : 0;

  drawImg(img, bx + shake, by + deadSink, bw, bh, b.facing < 0);

  // Boss 彈幕
  for (const p of projectiles) {
    drawImg(assets['boss_droplet'], p.x - 8, p.y - 8, 16, 16);
  }
  // 震波
  for (const s of shockwaves) {
    drawImg(assets['boss_shockwave'], s.x, s.y, s.w, s.h, s.vx < 0);
  }
}

function renderHUD() {
  const p = player;
  // 愛心
  for (let i = 0; i < 3; i++) {
    const hImg = i < p.hearts ? assets['heart_full'] : assets['heart_empty'];
    drawImg(hImg, 14 + i * 32, 12, 24, 24);
  }
  // 擊倒數（關卡時）
  if (state === 'LEVEL') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(12, 42, 80, 20);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px Noto Sans TC, sans-serif';
    ctx.fillText(`擊倒: ${killCount}`, 18, 56);
  }
  // 目標提示
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W - 185, 10, 180, 22);
  ctx.fillStyle = '#ffe566';
  ctx.font = 'bold 13px Noto Sans TC, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('打倒魔王，救出主人！', W - 14, 25);
  ctx.textAlign = 'left';
}

function renderBossHUD() {
  if (!boss) return;
  const bw = 240, bh = 22;
  const bx = (W - bw) / 2;
  const by = 14;
  // 標題
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(bx - 4, by - 18, bw + 8, 48);
  ctx.fillStyle = '#e0eeff';
  ctx.font = 'bold 12px Noto Sans TC, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('巨大洗耳液魔王', W / 2, by - 4);
  ctx.textAlign = 'left';
  // 血量槽背景
  ctx.fillStyle = '#3a1a2a';
  ctx.fillRect(bx, by, bw, bh);
  // 血量
  ctx.fillStyle = '#e03060';
  const ratio = Math.max(0, boss.hp / boss.maxHp);
  ctx.fillRect(bx, by, bw * ratio, bh);
  // 分格
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  for (let i = 1; i < boss.maxHp; i++) {
    const ix = bx + bw * i / boss.maxHp;
    ctx.beginPath(); ctx.moveTo(ix, by); ctx.lineTo(ix, by + bh); ctx.stroke();
  }
  ctx.strokeRect(bx, by, bw, bh);
}

function renderStoryScene(scene) {
  // 深色背景
  const alpha = Math.min(1, storyTick / 20);
  ctx.fillStyle = scene === 2 ? `rgba(10,5,20,${alpha})` : `rgba(30,20,50,${alpha})`;
  ctx.fillRect(0, 0, W, H);

  const midY = H / 2 - 40;

  if (scene === 0) {
    // 主人餵食
    drawSprite(assets['owner'], OWNER_FRAME, 200, midY - 100, 80, 200);
    drawImg(assets['decor_snack'], 295, midY + 50, 36, 36);
    // Soju idle
    const sp = SOJU_FRAMES.idle;
    const f = sp.frames[Math.floor(storyTick / sp.dur) % 4];
    drawSprite(assets['idle'], f, 370, midY + 30, 90, 80);
  } else if (scene === 1) {
    drawSprite(assets['owner'], OWNER_FRAME, 150, midY - 90, 80, 200);
    drawImg(assets['boss_cloaked'], 650, midY - 60, 90, 160);
  } else if (scene === 2) {

  } else if (scene === 3) {

  } else if (scene === 4) {

    const f = sp.frames[Math.floor(storyTick / sp.dur) % 4];
    drawSprite(assets['bite'], f, W/2 - 80, midY - 30, 160, 140);

}

// ═══════════════════════════════════════════════════════════
// 11. 主迴圈
// ═══════════════════════════════════════════════════════════
let lastTime = 0;
let accum = 0;
const STEP = 1000 / 60;

function update() {
  if (state === 'TITLE') {
    if (justPressed['Space']) { state = 'STORY'; storyScene = 0; storyTick = 0; }
  } else if (state === 'STORY') {
    if (justPressed['Space']) {
      storyScene++;
      storyTick = 0;
      if (storyScene >= 5) { state = 'LEVEL'; resetLevel(); }
    }
  } else if (state === 'LEVEL') {
    updateLevel();
  } else if (state === 'BOSS_INTRO') {
    updateBossIntro();
  } else if (state === 'BOSS') {
    updatePlayer();
    updateBoss();
  }
  clearJustPressed();
}

function render() {
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);
  if (state === 'TITLE') renderTitle();
  else if (state === 'STORY') renderStory();
  else if (state === 'LEVEL') renderLevel();
  else if (state === 'BOSS_INTRO') renderBossIntro();
  else if (state === 'BOSS') renderBossRoom();
  else if (state === 'WIN') renderWin();
  else if (state === 'LOSE') renderLose();
}

function gameLoop(ts) {
  if (state === 'LOADING') return;
  accum += ts - lastTime;
  lastTime = ts;
  while (accum >= STEP) { update(); accum -= STEP; }
  render();
  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════════════════════════
// 12. 啟動
// ═══════════════════════════════════════════════════════════
document.getElementById('restartBtn').addEventListener('click', () => {
  resetLevel();
  state = 'LEVEL';
  document.getElementById('restartBtn').style.display = 'none';
  ensureAudio();
});

loadAllAssets().then(() => {
  document.getElementById('loadingScreen').style.display = 'none';
  state = 'TITLE';
  lastTime = performance.now();
  requestAnimationFrame((ts) => { lastTime = ts; requestAnimationFrame(gameLoop); });
});
</script>
</body>
</html>
