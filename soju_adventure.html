const assets = {};

const TOTAL_ASSETS = 27;

function updateLoadingBar() {
  assetsLoaded++;
  document.getElementById('loadingBar').style.width = (assetsLoaded / TOTAL_ASSETS * 100) + '%';
}

function loadImage(name, src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { assets[name] = img; updateLoadingBar(); resolve(); };
    img.onerror = () => { console.warn('Failed to load:', src); updateLoadingBar(); resolve(); };
    img.src = src;
  });
}

function loadWithChromaKey(name, src, targetBg, tol = 26) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const oc = document.createElement('canvas');
      oc.width = img.width; oc.height = img.height;
      const octx = oc.getContext('2d');
      octx.drawImage(img, 0, 0);
      const d = octx.getImageData(0, 0, img.width, img.height);
      const px = d.data;
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i], g = px[i+1], b = px[i+2];
        const isGray = Math.abs(r-g) <= 16 && Math.abs(g-b) <= 16;
        const matchBg = Math.abs(r-targetBg[0]) <= tol && Math.abs(g-targetBg[1]) <= tol && Math.abs(b-targetBg[2]) <= tol;
        if (isGray && matchBg) px[i+3] = 0;
      }
      octx.putImageData(d, 0, 0);
      assets[name] = oc;
      updateLoadingBar();
      resolve();
    };
    img.onerror = () => { updateLoadingBar(); resolve(); };
    img.src = src;
  });
}

function tone(type, freqStart, freqEnd, duration, vol = 0.18) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.start(); osc.stop(audioCtx.currentTime + duration + 0.01);
}

  ['C4',.75],['C4',.25],['D4',1],['C4',1],['G4',1],['F4',2],
  ['C4',.75],['C4',.25],['C5',1],['A4',1],['F4',1],['E4',1],['D4',2],

];
let birthdayPlayed = false;
function playBirthday() {
  if (!audioCtx || birthdayPlayed) return;
  birthdayPlayed = true;
  let t = audioCtx.currentTime + 0.1;
  const beat = 0.42;
  for (const [note, len] of BIRTHDAY) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.value = NOTE_FREQ[note];
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + len * beat * 0.9);
    osc.start(t); osc.stop(t + len * beat);
    t += len * beat;
  }
  // loop once more
  t += 0.5;
  for (const [note, len] of BIRTHDAY) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.value = NOTE_FREQ[note];
    g.gain.setValueAtTime(0.14, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + len * beat * 0.9);
    osc.start(t); osc.stop(t + len * beat);
    t += len * beat;
  }
}

function drawSprite(img, frame, dx, dy, dw, dh, flipX = false) {
  if (!img) return;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (flipX) {
    ctx.translate(Math.round(dx + dw), Math.round(dy));
    ctx.scale(-1, 1);
    ctx.drawImage(img, frame.sx, frame.sy, frame.sw, frame.sh, 0, 0, dw, dh);
  } else {
    ctx.drawImage(img, frame.sx, frame.sy, frame.sw, frame.sh, Math.round(dx), Math.round(dy), dw, dh);
  }
  ctx.restore();
}

function drawImg(img, dx, dy, dw, dh, flipX = false) {
  if (!img) return;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (flipX) {
    ctx.translate(Math.round(dx + dw), Math.round(dy));
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0, dw, dh);
  } else {
    ctx.drawImage(img, Math.round(dx), Math.round(dy), dw, dh);
  }
  ctx.restore();
}

// 6.1 Hitbox 與 Hurtbox 碰撞與接觸點 (Contact Point)
class Hitbox {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
  }
  static checkOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }
  // 計算兩個包圍盒重疊區域的幾何中心點 (Contact Point)
  static getContactPoint(a, b) {
    const minX = Math.max(a.x, b.x);
    const maxX = Math.min(a.x + a.w, b.x + b.w);
    const minY = Math.max(a.y, b.y);
    const maxY = Math.min(a.y + a.h, b.y + b.h);
    return {
      x: (minX + maxX) / 2,
      y: (minY + maxY) / 2
    };
  }
}

// 6.2 打擊停頓模組 (Hitstop / Frame Freeze)
// 命中間隔 3-7 幀凍結主邏輯與動畫位移，產生極沉重之打擊肉感
const Hitstop = {
  frames: 0,
  trigger(f) {
    this.frames = Math.max(this.frames, f);
  },
  update() {
    if (this.frames > 0) {
      this.frames--;
      return true; // 正在 Hitstop 凍結中
    }
    return false;
  }
};

// 6.3 輕量級隨機震屏模組 (Camera Shake)
const CameraShake = {
  trauma: 0,
  offsetX: 0,
  offsetY: 0,
  decay: 0.80,

  shake(amount) {
    this.trauma = Math.min(10, Math.max(this.trauma, amount));
  },

  update() {
    if (this.trauma > 0.25) {
      const angle = Math.random() * Math.PI * 2;
      const dist = this.trauma * (0.6 + Math.random() * 0.4);
      this.offsetX = Math.cos(angle) * dist;
      this.offsetY = Math.sin(angle) * dist;
      this.trauma *= this.decay;
    } else {
      this.offsetX = 0;
      this.offsetY = 0;
      this.trauma = 0;
    }
  }
};

// 6.4 動態輸入快取模組 (Input Buffering ~150ms)
const InputBuffer = {
  queue: [],
  BUFFER_MS: 150, // 150ms 視窗

  push(action) {
    this.queue.push({ action, time: performance.now() });
    if (this.queue.length > 12) this.queue.shift();
  },

  has(action) {
    const now = performance.now();
    return this.queue.some(item => item.action === action && (now - item.time) <= this.BUFFER_MS);
  },

  consume(action) {
    const now = performance.now();
    const idx = this.queue.findIndex(item => item.action === action && (now - item.time) <= this.BUFFER_MS);
    if (idx !== -1) {
      this.queue.splice(idx, 1);
      return true;
    }
    return false;
  },

  cleanup() {
    const now = performance.now();
    this.queue = this.queue.filter(item => (now - item.time) <= this.BUFFER_MS);
  },

  clear() {
    this.queue = [];
  }
};

// 6.6 視覺特效與打擊點 Hook 系統 (VFX Spawn Hooks)
const VFXManager = {
  particles: [],
  rings: [],
  slashes: [],
  floatingTexts: [],
  hooks: [],

  // 外部事件監聽註冊 Hook
  onHit(fn) {
    this.hooks.push(fn);
  },

  // 觸發打擊特效廣播
  emitHit(event) {
    // 執行已註冊的 Hook 監聽器
    for (const hook of this.hooks) {
      try { hook(event); } catch (e) { console.error('VFX Hook error:', e); }
    }

    const { contactX, contactY, move, isKill, facing } = event;
    const isHeavy = move.id === 'uppercut' || isKill;

    // 1. 打擊火花 (Hit Sparks)
    const sparkCount = isHeavy ? 14 : 7;
    for (let i = 0; i < sparkCount; i++) {
      const baseAngle = facing > 0 ? 0 : Math.PI;
      const spread = (Math.random() - 0.5) * 1.5;
      const angle = baseAngle + spread;
      const speed = (isHeavy ? 4.5 : 2.8) + Math.random() * 4.0;
      this.particles.push({
        x: contactX,
        y: contactY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (Math.random() * 2.5),
        life: 14 + Math.floor(Math.random() * 8),
        maxLife: 22,
        size: isHeavy ? (3 + Math.random() * 3) : (2 + Math.random() * 2),
        color: isHeavy ? ['#ffffff', '#ffea00', '#ff3b30'][i % 3] : ['#ffffff', '#ffe566', '#ff9500'][i % 3]
      });
    }

    // 2. 擴散衝擊氣浪環 (Impact Ring)
    this.rings.push({
      x: contactX,
      y: contactY,
      radius: 6,
      maxRadius: isHeavy ? 38 : 22,
      alpha: 1,
      color: isHeavy ? '#fff066' : '#ffffff',
      lineWidth: isHeavy ? 4 : 2
    });

    // 3. 抓痕/咬痕光弧 (Slash Arc)
    this.slashes.push({
      x: contactX,
      y: contactY,
      facing: facing,
      angle: isHeavy ? -Math.PI / 4 : 0,
      length: isHeavy ? 45 : 30,
      life: 8,
      maxLife: 8,
      color: isHeavy ? '#ffdd44' : '#ffffff'
    });

    // 4. 浮動打擊文字 (Combo / Damage text)
    let txt = '';
    let txtColor = '#ffffff';
    if (isKill) {
      txt = 'K.O.!';
      txtColor = '#ff3b30';
    } else if (move.id === 'uppercut') {
      txt = 'LAUNCH!';
      txtColor = '#ff9500';
    } else if (event.comboCount >= 2) {
      txt = `${event.comboCount} HITS!`;
      txtColor = '#ffcc00';
    }
    if (txt) {
      this.floatingTexts.push({
        text: txt,
        x: contactX,
        y: contactY - 14,
        vy: -1.6,
        life: 32,
        maxLife: 32,
        color: txtColor,
        scale: isHeavy ? 1.3 : 1.0
      });
    }
  },

  spawnJumpCancelDust(x, y) {
    for (let i = 0; i < 6; i++) {
      this.particles.push({
        x: x + (Math.random() - 0.5) * 20,
        y: y,
        vx: (Math.random() - 0.5) * 4,
        vy: -Math.random() * 2.5,
        life: 12,
        maxLife: 12,
        size: 3,
        color: 'rgba(255, 230, 180, 0.8)'
      });
    }
  },

  update() {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18;
      p.life--;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.radius += (r.maxRadius - r.radius) * 0.32;
      r.alpha -= 0.1;
      if (r.alpha <= 0) this.rings.splice(i, 1);
    }
    for (let i = this.slashes.length - 1; i >= 0; i--) {
      const s = this.slashes[i];
      s.life--;
      if (s.life <= 0) this.slashes.splice(i, 1);
    }
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const t = this.floatingTexts[i];
      t.y += t.vy;
      t.vy *= 0.92;
      t.life--;
      if (t.life <= 0) this.floatingTexts.splice(i, 1);
    }
  },

  render(ctx, camX) {
    ctx.save();
    // 氣浪環
    for (const r of this.rings) {
      ctx.beginPath();
      ctx.arc(r.x - camX, r.y, r.radius, 0, Math.PI * 2);
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.lineWidth;
      ctx.globalAlpha = Math.max(0, r.alpha);
      ctx.stroke();
    }
    // 光弧
    for (const s of this.slashes) {
      const progress = 1 - (s.life / s.maxLife);
      ctx.save();
      ctx.translate(s.x - camX, s.y);
      if (s.facing < 0) ctx.scale(-1, 1);
      ctx.rotate(s.angle);
      ctx.beginPath();
      ctx.arc(0, 0, s.length, -Math.PI / 4, Math.PI / 4);
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 3 * (1 - progress);
      ctx.globalAlpha = 1 - progress;
      ctx.stroke();
      ctx.restore();
    }
    // 打擊火花
    for (const p of this.particles) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.beginPath();
      ctx.arc(p.x - camX, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    // 浮動文字
    for (const t of this.floatingTexts) {
      const alpha = Math.max(0, t.life / t.maxLife);
      ctx.save();
      ctx.font = `bold ${Math.round(15 * t.scale)}px 'Arial Black', sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = t.color;
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 3;
      ctx.globalAlpha = alpha;
      ctx.strokeText(t.text, t.x - camX, t.y);
      ctx.fillText(t.text, t.x - camX, t.y);
      ctx.restore();
    }
    ctx.restore();
  }
};

// 7. 輸入管理 (含動態輸入快取掛載)

const keys = {};
const justPressed = {};
let gameState = 'LOADING';

window.addEventListener('keydown', (e) => {
  if (gameState === 'WIN') return;
  const k = e.key === ' ' ? 'Space' : e.key;
  if (!keys[k]) {
    justPressed[k] = true;
    if (k === 'Space') InputBuffer.push('attack');
    if (k === 'ArrowUp' || k === 'w' || k === 'W') InputBuffer.push('jump');
  }
  keys[k] = true;
  ensureAudio();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(k)) {
    e.preventDefault();
  }
});
window.addEventListener('keyup', (e) => {
  const k = e.key === ' ' ? 'Space' : e.key;
  keys[k] = false;
});
function clearJustPressed() {
  for (const k in justPressed) delete justPressed[k];
}

// 9. 碰撞工具
// ═══════════════════════════════════════════════════════════
function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

function platformLand(p) {
  if (p.vy < 0) return;
  const px = p.x, py = p.y + PLAYER_HIT_H;
  for (const plat of PLATFORMS) {
    if (px + PLAYER_HIT_W > plat.x && px < plat.x + plat.w) {
      const prevBottom = py - p.vy;
      if (prevBottom <= plat.y && py >= plat.y) {
        p.y = plat.y - PLAYER_HIT_H;
        p.vy = 0;
        p.onGround = true;
        return;
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════
function updatePlayer() {
  const p = player;
  // 移動與加速度計算
  let moveInput = 0;
  if (keys['ArrowLeft'] || keys['a']) moveInput -= 1;
  if (keys['ArrowRight'] || keys['d']) moveInput += 1;

  const currentAccel = p.onGround ? ACCEL : AIR_ACCEL;
  const currentDecel = p.onGround ? DECEL : AIR_DECEL;

  if (moveInput !== 0) {
    p.facing = moveInput > 0 ? 1 : -1;
    // 轉向煞車加成
    if ((moveInput > 0 && p.vx < 0) || (moveInput < 0 && p.vx > 0)) {
      p.vx += moveInput * (currentAccel + TURN_BOOST);
    } else {
      p.vx += moveInput * currentAccel;
    }
    // 限制最大速度
    if (Math.abs(p.vx) > MAX_SPEED) {
      p.vx = Math.sign(p.vx) * MAX_SPEED;
    }
  } else {
    // 鬆開按鍵時摩擦減速滑行
    if (Math.abs(p.vx) <= currentDecel) {
      p.vx = 0;
    } else {
      p.vx -= Math.sign(p.vx) * currentDecel;
    }
  }
  const moving = Math.abs(p.vx) > 0.25;

  // ══════════════════════════════════════════
  // 動態輸入快取檢測 (Input Buffer)
  // ══════════════════════════════════════════
  const wantsJump = justPressed['ArrowUp'] || justPressed['w'] || InputBuffer.has('jump');
  const wantsAttack = justPressed['Space'] || InputBuffer.has('attack');
  const isHoldingUp = keys['ArrowUp'] || keys['w'];

  // 1. 跳躍取消 (Jump Cancel) 機制：
  // 招式命中判定成功後，可在後搖期間立刻透過跳躍取消，進入空中連擊追擊 (Air Combo)！
  if (p.attackFrames > 0 && p.attackHasHit && p.jumpCancelable && wantsJump && p.onGround) {
    p.attackFrames = 0;
    p.attackCooldown = 0;
    p.attackMove = null;
    p.vy = JUMP_V;
    p.onGround = false;
    InputBuffer.consume('jump');
    SFX.jump();
    SFX.cancel();
    VFXManager.spawnJumpCancelDust(p.x + PLAYER_HIT_W / 2, p.y + PLAYER_HIT_H);
  } else if (p.onGround && wantsJump && p.attackFrames <= 0) {
    p.vy = JUMP_V;
    p.onGround = false;
    InputBuffer.consume('jump');
    SFX.jump();
  }

  // 2. 攻擊判定與連招取消 (Combo Cancel: 用手揍 -> 用頭頂 -> 迴旋踢)
  const canNormalAttack = p.attackFrames <= 0 && p.attackCooldown <= 0;
  const canComboCancel = p.attackFrames > 0 && p.attackHasHit && p.canComboCancel;

  if (wantsAttack && (canNormalAttack || canComboCancel)) {
    InputBuffer.consume('attack');

    let chosenMove = null;
    if (!p.onGround) {
      // 空中飛踢 (Aerial Kick)：給予向上滯空懸浮力，維持空中連段
      chosenMove = ATTACK_TYPES.AERIAL;
      p.vy = Math.min(p.vy, -2.8);
    } else if (p.comboStage === 2 || isHoldingUp) {
      // 第三擊（或按住上）：迴旋踢 (Spin Kick) - 敵人會飛比較遠！
      chosenMove = ATTACK_TYPES.KICK;
      p.comboStage = 0;
      p.comboTimer = 0;
      p.vx = p.facing * 3.2; // 迴旋踢向前大踏步衝刺
    } else if (p.comboStage === 1) {
      // 第二擊：用頭頂 (Headbutt)
      chosenMove = ATTACK_TYPES.HEAD;
      p.comboStage = 2;
      p.comboTimer = 28;
      p.vx = p.facing * 2.2; // 頭頂前頂位移
    } else {
      // 第一擊：用手揍 (Punch)
      chosenMove = ATTACK_TYPES.PUNCH;
      p.comboStage = 1;
      p.comboTimer = 24;
      p.vx = p.facing * 1.5; // 出拳向前踏步
    }

    p.attackMove = chosenMove;
    p.attackFrames = chosenMove.activeFrames;
    p.attackCooldown = chosenMove.recoveryFrames;
    p.attackHasHit = false;
    p.jumpCancelable = false;
    p.canComboCancel = false;
    p.anim = chosenMove.anim;
    p.animTick = 0;
    p.animFrame = 0;

    // 重置所有敵人的受擊標記，確保新的一擊能命中
    for (const e of enemies) e.hasBeenHitThisAttack = false;

    if (SFX[chosenMove.sfx]) SFX[chosenMove.sfx]();
  }

  // 連招間隔與計數器逾時重置
  if (p.comboTimer > 0) {
    p.comboTimer--;
    if (p.comboTimer <= 0) p.comboStage = 0;
  }
  if (p.comboResetTimer > 0) {
    p.comboResetTimer--;
    if (p.comboResetTimer <= 0) p.comboCount = 0;
  }

  if (p.attackFrames > 0) p.attackFrames--;
  if (p.attackCooldown > 0) p.attackCooldown--;
  if (p.hurtFrames > 0) p.hurtFrames--;

  // 物理
  p.vy += GRAVITY;
  p.x += p.vx;
  p.y += p.vy;

  // 邊界
  p.x = Math.max(0, Math.min(LEVEL_WIDTH - PLAYER_HIT_W, p.x));

  // 平台碰撞
  p.onGround = false;
  if (p.y + PLAYER_HIT_H > GROUND_Y) {
    // 黑暗玩具坑
    const centerX = p.x + PLAYER_HIT_W / 2;
    if (centerX > PIT_START && centerX < PIT_END) {
      // 掉坑
      hurtPlayer();
      p.x = PIT_START - 50;
      p.y = GROUND_Y - PLAYER_HIT_H;
      p.vy = 0;
      p.onGround = true;
    } else {
      p.y = GROUND_Y - PLAYER_HIT_H;
      p.vy = 0;
      p.onGround = true;
    }
  }
  platformLand(p);

  // 動畫狀態
  let newAnim = 'idle';
  if (p.attackFrames > 0 && p.attackMove) newAnim = p.attackMove.anim;
  else if (!p.onGround) newAnim = 'jump';
  else if (moving) newAnim = 'run';

  if (newAnim !== p.anim) { p.anim = newAnim; p.animTick = 0; p.animFrame = 0; }
  const animDef = SOJU_FRAMES[p.anim] || SOJU_FRAMES.idle;
  p.animTick++;
  if (p.animTick >= animDef.dur) { p.animTick = 0; p.animFrame = (p.animFrame + 1) % animDef.frames.length; }
}

function hurtPlayer() {
  const p = player;
  if (p.hurtFrames > 0) return;
  p.hearts--;
  p.hurtFrames = HURT_IFRAMES;
  SFX.hurt();
  CameraShake.shake(4.5);
  if (p.hearts <= 0) {
    state = 'LOSE';
    document.getElementById('restartBtn').style.display = 'block';
  }
}

function updateEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;

    // 1. 致命擊殺死亡飛出物理 (Death Launch Physics)
    if (e.deathLaunched) {
      e.x += e.kbVx;
      e.y += e.kbVy;
      e.kbVy += GRAVITY * 0.7;
      e.spinAngle += 0.35 * (e.kbVx >= 0 ? 1 : -1);
      e.deathTimer--;
      if (e.deathTimer <= 0 || e.y > H + 60) {
        e.alive = false;
        killCount++;
        SFX.kill();
        CameraShake.shake(6);
        // 死亡煙火粒子
        for (let i = 0; i < 18; i++) {
          VFXManager.particles.push({
            x: e.x + e.w / 2,
            y: e.y + e.h / 2,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.7) * 10,
            life: 20 + Math.random() * 10,
            maxLife: 30,
            size: 3 + Math.random() * 3,
            color: ['#ff4444', '#ffbb00', '#ffffff'][i % 3]
          });
        }
      }
      continue;
    }

    // 2. 敵人自身的打擊停頓 (Hitstop Freeze)
    if (e.hitstopTimer > 0) {
      e.hitstopTimer--;
      continue; // 停頓中暫停位移與動畫更新
    }

    // 3. 受擊硬直 (HitStun) 與擊飛物理 (Knockback & Air Juggle Physics)
    if (e.hitStun > 0) {
      e.hitStun--;
      if (e.flashTimer > 0) e.flashTimer--;
      if (e.hpBarTimer > 0) e.hpBarTimer--;
      e.isAttacking = false;
      e.attackPhase = 'none';

      // 方向性衝量位移
      e.x += e.kbVx;
      e.y += e.kbVy;
      e.kbVx *= 0.90;           // 水平阻力衰減
      e.kbVy += GRAVITY * 0.65;  // 空中受擊浮空重力

      // 落地邊界
      if (e.y >= e.baseY) {
        e.y = e.baseY;
        if (e.kbVy > 3) {
          e.kbVy = -e.kbVy * 0.3; // 落地輕微回彈
        } else {
          e.kbVy = 0;
        }
      }
      // 處於 HitStun 硬直時，無法移動也無法對玩家造成碰撞傷害
      continue;
    }

    if (e.hpBarTimer > 0) e.hpBarTimer--;

    // 4. 敵人主動攻擊 AI 行為（冷卻、前搖預警、主動攻擊、收招）
    if (e.attackCooldown > 0) e.attackCooldown--;

    const distToPlayerX = (player.x + PLAYER_HIT_W / 2) - (e.x + e.w / 2);
    const distToPlayerY = Math.abs((player.y + PLAYER_HIT_H / 2) - (e.y + e.h / 2));
    const isPlayerNearby = Math.abs(distToPlayerX) < 160 && distToPlayerY < 75;

    if (e.type === 'slipper') {
      if (e.attackPhase === 'windup') {
        // 前搖蓄力預備拍打
        e.attackTimer--;
        if (e.attackTimer <= 0) {
          e.attackPhase = 'strike';
          e.attackTimer = 18;
          e.isAttacking = true; // 進入傷害判定幀！
          e.vx = e.dir * 4.6;
        }
      } else if (e.attackPhase === 'strike') {
        // 主動拍打撲擊中 (傷害判定開啟！)
        e.x += e.vx;
        e.attackTimer--;
        if (e.attackTimer <= 0) {
          e.attackPhase = 'recover';
          e.attackTimer = 16;
          e.isAttacking = false;
          e.vx = 0;
        }
      } else if (e.attackPhase === 'recover') {
        e.attackTimer--;
        if (e.attackTimer <= 0) {
          e.attackPhase = 'none';
          e.attackCooldown = 70 + Math.floor(Math.random() * 30);
        }
      } else {
        // 正常巡邏巡視（非攻擊狀態，碰到主角不造成傷害）
        e.isAttacking = false;
        if (isPlayerNearby && e.attackCooldown <= 0) {
          e.dir = distToPlayerX > 0 ? 1 : -1;
          e.attackPhase = 'windup';
          e.attackTimer = 22;
        } else {
          e.x += e.speed * e.dir;
          if (e.x < e.range[0]) { e.x = e.range[0]; e.dir = 1; }
          if (e.x + e.w > e.range[1]) { e.x = e.range[1] - e.w; e.dir = -1; }
        }
      }
    } else if (e.type === 'dyson') {
      if (e.attackPhase === 'windup') {
        // 渦輪狂轉蓄力
        e.attackTimer--;
        if (e.attackTimer <= 0) {
          e.attackPhase = 'strike';
          e.attackTimer = 22;
          e.isAttacking = true; // 衝撞吸入攻擊判定開啟！
          e.vx = e.dir * 6.0;
        }
      } else if (e.attackPhase === 'strike') {
        e.x += e.vx;
        e.attackTimer--;
        if (e.attackTimer <= 0) {
          e.attackPhase = 'recover';
          e.attackTimer = 22;
          e.isAttacking = false;
          e.vx = 0;
        }
      } else if (e.attackPhase === 'recover') {
        e.attackTimer--;
        if (e.attackTimer <= 0) {
          e.attackPhase = 'none';
          e.attackCooldown = 85 + Math.floor(Math.random() * 30);
        }
      } else {
        e.isAttacking = false;
        if (isPlayerNearby && e.attackCooldown <= 0) {
          e.dir = distToPlayerX > 0 ? 1 : -1;
          e.attackPhase = 'windup';
          e.attackTimer = 25;
        } else {
          if (e.pause > 0) { e.pause--; }
          else {
            e.x += e.speed * e.dir;
            if (e.x < e.range[0]) { e.x = e.range[0]; e.dir = 1; e.pause = 26; }
            if (e.x + e.w > e.range[1]) { e.x = e.range[1] - e.w; e.dir = -1; e.pause = 26; }
          }
        }
      }
    } else if (e.type === 'ball') {
      e.vy = (e.vy || 0) + GRAVITY * 0.55;
      e.y += e.vy;
      // 當彈力球從高空高速下墜時視為重擊砸地攻擊 (vy > 3.2)！
      e.isAttacking = (e.vy > 3.2);
      if (e.y >= e.baseY) {
        e.y = e.baseY;
        e.vy = -10.5;
        e.isAttacking = false; // 觸地反彈上升階段不傷人
      }
    }

    // 5. 檢測玩家 AttackBox 與 敵人 HurtBox 碰撞
    if (player.attackFrames > 0 && player.attackMove && !e.hasBeenHitThisAttack) {
      const move = player.attackMove;
      let atkX = player.facing === 1 ? player.x + PLAYER_HIT_W - 8 : player.x - ATTACK_W + 8;
      let atkY = player.y + 4;
      let atkW = ATTACK_W;
      let atkH = ATTACK_H;

      // 迴旋踢判定更廣更長
      if (move.id === 'kick') {
        atkW = ATTACK_W + 30;
        atkH = ATTACK_H + 8;
        if (player.facing === -1) atkX -= 30;
      } else if (move.id === 'head') {
        atkW = ATTACK_W + 10;
        atkH = ATTACK_H + 4;
      }

      const attackBox = new Hitbox(atkX, atkY, atkW, atkH);
      const hurtBox = new Hitbox(e.x, e.y, e.w, e.h);

      if (Hitbox.checkOverlap(attackBox, hurtBox)) {
        e.hasBeenHitThisAttack = true;
        e.isAttacking = false; // 玩家攻擊打斷敵方攻擊！
        e.attackPhase = 'none';
        player.attackHasHit = true;
        player.jumpCancelable = move.canJumpCancelOnHit;
        player.canComboCancel = true;

        // 計算重疊幾何中心點 (Contact Point)
        const contact = Hitbox.getContactPoint(attackBox, hurtBox);

        // 扣除敵人血量
        e.hp -= move.damage;
        e.hpBarTimer = 110;

        // 連擊統計
        player.comboCount = (player.comboCount || 0) + 1;
        player.comboResetTimer = 75;

        const isKill = e.hp <= 0;

        // 5.1 打擊停頓 (Hitstop / Frame Freeze)
        const hitstopFrames = isKill ? move.hitstop + 2 : move.hitstop;
        Hitstop.trigger(hitstopFrames);
        e.hitstopTimer = hitstopFrames;

        // 5.2 鏡頭震動 (Camera Shake)
        CameraShake.shake(isKill ? move.shake + 2.5 : move.shake);

        // 5.3 受擊僵直與方向性衝量向量 (Knockback Vector)
        e.flashTimer = hitstopFrames + 5;
        if (isKill) {
          e.deathLaunched = true;
          e.deathTimer = 36;
          // ★ 迴旋踢擊殺時，擊飛超遠！
          const killMult = move.id === 'kick' ? 2.2 : 1.8;
          e.kbVx = player.facing * (move.kbX * killMult + 3.0);
          e.kbVy = Math.min(-8.5, move.kbY - 2.5);
        } else {
          e.hitStun = move.hitStun;
          // ★ 在踢的時候，敵人會飛比較遠！
          e.kbVx = player.facing * move.kbX;
          e.kbVy = move.kbY;
        }

        // 5.4 音效播放
        if (SFX[move.sfx]) SFX[move.sfx]();

        // 5.5 觸發打擊特效 Hook
        VFXManager.emitHit({
          contactX: contact.x,
          contactY: contact.y,
          attacker: player,
          defender: e,
          move: move,
          isHeavy: move.id === 'kick',
          isKill: isKill,
          facing: player.facing,
          comboCount: player.comboCount
        });
      }
    }

    // 6. 核心機制：只有在敵人主動攻擊時 (e.isAttacking === true)，主角才會受傷！
    // 單純碰到敵人不會受傷！
    if (!e.deathLaunched && e.hitStun <= 0 && e.isAttacking) {
      if (aabb(player.x, player.y, PLAYER_HIT_W, PLAYER_HIT_H, e.x, e.y, e.w, e.h)) {
        hurtPlayer();
        e.isAttacking = false; // 命中後單次結算傷害，避免多重扣血
      }
    }
  }
}

function updateBoss() {
  const b = boss;
  if (!b || b.phase === 'dead') return;
  if (b.hitCooldown > 0) b.hitCooldown--;

  // 攻擊玩家 hitbox - 只有在 Boss 進行 slam 重砸下墜時才造成直接碰撞傷害！
  // 單純站在 Boss 旁邊不會受傷！
  if (b.phase === 'action' && b.nextPattern === 'slam' && b.vy > 1.0) {
    if (aabb(player.x, player.y, PLAYER_HIT_W, PLAYER_HIT_H, b.x, b.y, b.w, b.h)) {
      hurtPlayer();
    }
  }

  // Boss 被咬/打擊判定
  if (player.attackFrames > 0 && player.attackMove && b.hitCooldown <= 0) {
    const move = player.attackMove;
    let atkX = player.facing === 1 ? player.x + PLAYER_HIT_W - 8 : player.x - ATTACK_W + 8;
    let atkY = player.y + 4;
    let atkW = ATTACK_W;
    let atkH = ATTACK_H;
    if (move.id === 'kick') { atkW = ATTACK_W + 30; atkH = ATTACK_H + 10; if (player.facing === -1) atkX -= 30; }

    const attackBox = new Hitbox(atkX, atkY, atkW, atkH);
    const hurtBox = new Hitbox(b.x, b.y, b.w, b.h);

    if (Hitbox.checkOverlap(attackBox, hurtBox)) {
      player.attackHasHit = true;
      player.jumpCancelable = true;
      player.canComboCancel = true;
      player.comboCount = (player.comboCount || 0) + 1;
      player.comboResetTimer = 75;

      b.hp -= (move.id === 'kick' ? 2 : 1);
      b.hitCooldown = 32;
      b.flashTimer = 8;

      const contact = Hitbox.getContactPoint(attackBox, hurtBox);
      const isKill = b.hp <= 0;

      Hitstop.trigger(isKill ? 12 : move.hitstop + 1);
      CameraShake.shake(isKill ? 8.5 : move.shake + 1.5);
      SFX.bosshit();

      VFXManager.emitHit({
        contactX: contact.x,
        contactY: contact.y,
        attacker: player,
        defender: b,
        move: move,
        isHeavy: move.id === 'kick',
        isKill: isKill,
        facing: player.facing,
        comboCount: player.comboCount
      });

      if (b.hp <= 0) {
        b.phase = 'dead';
        b.timer = 90;
        projectiles = [];
        shockwaves = [];
        for (const e of b.summonedEnemies) e.alive = false;
      }
    }
  }

  b.timer--;
  if (b.phase === 'dead') {
    if (b.timer <= 0) { state = 'WIN'; winTick = 0; playBirthday(); }
    return;
  }

  if (b.phase === 'idle') {
    if (b.timer <= 0) {
      b.phase = 'telegraph';
      b.timer = 40;
      // 選招（避免連續）
      const patterns = ['spray', 'slam', 'summon'];
      const avail = patterns.filter(p => p !== b.lastPattern);
      b.nextPattern = avail[Math.floor(Math.random() * avail.length)];
      b.lastPattern = b.nextPattern;
    }
  } else if (b.phase === 'telegraph') {
    if (b.timer <= 0) {
      b.phase = 'action';
      b.timer = b.nextPattern === 'spray' ? 60 : b.nextPattern === 'slam' ? 80 : 50;
      b.actionTick = 0;
      b.sprayCount = 0;
    }
  } else if (b.phase === 'action') {
    b.actionTick++;
    if (b.nextPattern === 'spray') {
      // 每 18 tick 噴一顆
      if (b.actionTick % 18 === 1 && b.sprayCount < 3) {
        b.sprayCount++;
        const dir = player.x < b.x ? -1 : 1;
        projectiles.push({ x: b.x + b.w/2, y: GROUND_Y - 70, vx: dir * 4.6, w: 16, h: 16, alive: true });
      }
    } else if (b.nextPattern === 'slam') {
      if (b.actionTick === 1) {
        b.vy = -9;
        b.onGround = false;
      }
      b.vy += 0.5;
      b.y += b.vy;
      if (b.y >= GROUND_Y - b.h) {
        b.y = GROUND_Y - b.h;
        b.vy = 0;
        if (!b.onGround) {
          b.onGround = true;
          shockwaves.push({ x: b.x - 80, y: GROUND_Y - 18, vx: -5.2, w: 48, h: 18, alive: true });
          shockwaves.push({ x: b.x + b.w, y: GROUND_Y - 18, vx: 5.2, w: 48, h: 18, alive: true });
        }
      }
    } else if (b.nextPattern === 'summon') {
      if (b.actionTick === 10) {
        const ex = player.x < 480 ? 880 : 80;
        const et = Math.random() < 0.5 ? 'slipper' : 'ball';
        const ne = {
          type: et, x: ex, y: GROUND_Y - 32, w: et==='slipper'?48:32, h: 32,
          dir: ex > 480 ? -1 : 1, range: [50, 900], speed: 1.5, pause: 0, alive: true,
          vy: 0, baseY: GROUND_Y - 32, animTick: 0,
        };
        enemies.push(ne);
        b.summonedEnemies.push(ne);
      }
    }
    if (b.timer <= 0) { b.phase = 'recover'; b.timer = 70; b.onGround = true; }
  } else if (b.phase === 'recover') {
    if (b.timer <= 0) { b.phase = 'idle'; b.timer = 30 + Math.floor(Math.random() * 10); }
  }

  // Boss 面向玩家
  b.facing = player.x < b.x + b.w/2 ? -1 : 1;

  // 彈幕更新
  for (const p of projectiles) {
    p.x += p.vx;
    if (p.x < 0 || p.x > W) p.alive = false;
    if (aabb(player.x, player.y, PLAYER_HIT_W, PLAYER_HIT_H, p.x, p.y, p.w, p.h)) {
      p.alive = false; hurtPlayer();
    }
  }
  projectiles = projectiles.filter(p => p.alive);

  // 震波更新
  for (const s of shockwaves) {
    s.x += s.vx;
    if (s.x < -50 || s.x > W + 50) s.alive = false;
    if (aabb(player.x, player.y, PLAYER_HIT_W, PLAYER_HIT_H, s.x, s.y, s.w, s.h)) {
      s.alive = false; hurtPlayer();
    }
  }
  shockwaves = shockwaves.filter(s => s.alive);

  // 召喚小怪也要更新
  updateEnemies();
}

function updateLevel() {
  updatePlayer();
  updateEnemies();
  // 鏡頭跟隨
  const targetCam = player.x - W / 2 + PLAYER_HIT_W / 2;
  cameraX = Math.max(0, Math.min(LEVEL_WIDTH - W, targetCam));
  // 終點
  if (player.x > GATE_X) {
    state = 'BOSS_INTRO';
    bossIntroTimer = 0;
    boss = makeBoss();
    player.x = 60;
    player.y = GROUND_Y - PLAYER_HIT_H;
    player.vx = 0; player.vy = 0;
  }
}

function updateBossIntro() {
  bossIntroTimer++;
  if (bossIntroTimer === 70) boss.revealed = true;
  if (bossIntroTimer > 160 || justPressed['Space']) { state = 'BOSS'; }
}

// ═══════════════════════════════════════════════════════════
// 10. 渲染
// ═══════════════════════════════════════════════════════════

function renderBackground() {
  const bg = assets['bg_livingroom'];
  if (bg) {
    // 背景視差：以一半速度捲動
    const bgScale = H / bg.height;
    const bgW = bg.width * bgScale;
    const offset = -(cameraX * 0.4) % bgW;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(bg, offset, 0, bgW, H);
    if (offset + bgW < W) ctx.drawImage(bg, offset + bgW, 0, bgW, H);
  } else {
    ctx.fillStyle = '#c8a870';
    ctx.fillRect(0, 0, W, H);
  }
}

function renderPlatforms() {
  for (const p of PLATFORMS) {
    const sx = p.x - cameraX;
    if (sx > W || sx + p.w < 0) continue;
    const img = assets[p.sprite];
    if (img) {
      // 拼貼
      const tileW = p.w; const tileH = p.h;
      ctx.drawImage(img, Math.round(sx), p.y, tileW, tileH);
    } else {
      ctx.fillStyle = '#8B5E3C';
      ctx.fillRect(Math.round(sx), p.y, p.w, p.h);
    }
  }
}

function renderDecor() {
  for (const d of DECOR_DEFS) {
    const sx = d.x - cameraX;
    if (sx > W || sx + d.w < 0) continue;
    drawImg(assets[d.type], sx, d.y, d.w, d.h);
  }
}

function renderPit() {
  const sx = PIT_START - cameraX;
  if (sx < W && sx + (PIT_END - PIT_START) > 0) {
    const pw = PIT_END - PIT_START;
    ctx.fillStyle = '#0a0614';
    ctx.fillRect(Math.round(sx), GROUND_Y, pw, H - GROUND_Y);
    // 坑邊緣
    ctx.fillStyle = '#1a1030';
    ctx.fillRect(Math.round(sx), GROUND_Y, pw, 10);
    // 坑裡散落玩具（裝飾）
    ctx.font = '22px serif';
    ctx.fillText('🎮', Math.round(sx) + 10, GROUND_Y + 40);
    ctx.fillText('🧸', Math.round(sx) + 50, GROUND_Y + 55);
  }
}

function renderEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    const sx = e.x - cameraX;
    if (sx > W + 80 || sx + e.w < -80) continue;
    const img = assets[e.type];
    const flipX = e.dir ? e.dir < 0 : false;

    ctx.save();
    // 死亡飛出旋轉 (Death Launch)
    if (e.deathLaunched) {
      ctx.translate(sx + e.w / 2, e.y + e.h / 2);
      ctx.rotate(e.spinAngle);
      drawImg(img, -e.w / 2, -e.h / 2, e.w, e.h, false);
    } else {
      // 受擊微抖動 (Hitstop Vibration)
      let shakeX = 0, shakeY = 0;
      if (e.hitstopTimer > 0) {
        shakeX = (Math.random() - 0.5) * 5;
        shakeY = (Math.random() - 0.5) * 5;
      }
      // 前搖蓄力抖動
      if (e.attackPhase === 'windup') {
        shakeX = (Math.random() - 0.5) * 3;
        shakeY = (Math.random() - 0.5) * 2;
        ctx.filter = 'brightness(1.5) saturate(1.8)';
      }
      // 受擊閃爍 (Hit Flash Effect)
      if (e.flashTimer > 0) {
        ctx.filter = 'brightness(2.8) saturate(0.2)';
      }
      drawImg(img, sx + shakeX, e.y + shakeY, e.w, e.h, flipX);
    }
    ctx.restore();

    // 敵人攻擊前搖危險警示 (Telegraph Warning)
    if (e.attackPhase === 'windup' && !e.deathLaunched) {
      ctx.save();
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚠️', sx + e.w / 2, e.y - 14);
      ctx.restore();
    }

    // 敵人攻擊中紅色氣浪特效
    if (e.isAttacking && !e.deathLaunched) {
      ctx.save();
      ctx.fillStyle = 'rgba(255, 60, 0, 0.35)';
      ctx.beginPath();
      ctx.arc(sx + e.w / 2, e.y + e.h / 2, Math.max(e.w, e.h) * 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 敵人頭頂血條 (受擊時顯示)
    if (e.hpBarTimer > 0 && e.maxHp > 1 && !e.deathLaunched) {
      const barW = 44, barH = 5;
      const barX = sx + (e.w - barW) / 2;
      const barY = e.y - 12;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
      const fillW = Math.max(0, (e.hp / e.maxHp) * barW);
      ctx.fillStyle = e.hp > 1 ? '#4cd964' : '#ff3b30';
      ctx.fillRect(barX, barY, fillW, barH);
    }
  }
}

function renderPlayer() {
  const p = player;
  const px = p.x - cameraX - (PLAYER_DRAW_W - PLAYER_HIT_W) / 2;
  const py = p.y - (PLAYER_DRAW_H - PLAYER_HIT_H);

  // 無敵閃爍（每 6 frame 閃一次）
  if (p.hurtFrames > 0 && Math.floor(p.hurtFrames / 6) % 2 === 0) {
    ctx.globalAlpha = 0.35;
  }

  const animDef = SOJU_FRAMES[p.anim] || SOJU_FRAMES.idle;
  const frameIndex = p.animFrame % animDef.frames.length;
  const frame = animDef.frames[frameIndex];
  const img = assets[p.anim] || assets['idle'];
  drawSprite(img, frame, px, py, PLAYER_DRAW_W, PLAYER_DRAW_H, p.facing < 0);

  ctx.globalAlpha = 1;
}

function renderBossCreature() {
  const b = boss;
  if (!b) return;
  const bw = 120, bh = 150;
  const bx = b.x - (bw - b.w) / 2;
  const by = b.y - (bh - b.h);
  const img = b.revealed ? assets['boss_revealed'] : assets['boss_cloaked'];

  // telegraph 抖動
  let shake = 0;
  if (b.phase === 'telegraph') {
    shake = Math.sin(bossIntroTimer * 0.8 + Date.now() * 0.02) * 3;
  }
  // dead 下沉
  const deadSink = b.phase === 'dead' ? Math.min((90 - b.timer) * 0.5, 30) : 0;

  ctx.save();
  if (b.flashTimer > 0) {
    b.flashTimer--;
    ctx.filter = 'brightness(2.6)';
  }
  drawImg(img, bx + shake, by + deadSink, bw, bh, b.facing < 0);
  ctx.restore();

  // Boss 彈幕
  for (const p of projectiles) {
    drawImg(assets['boss_droplet'], p.x - 8, p.y - 8, 16, 16);
  }
  // 震波
  for (const s of shockwaves) {
    drawImg(assets['boss_shockwave'], s.x, s.y, s.w, s.h, s.vx < 0);
  }
}

function renderHUD() {
  const p = player;
  // 愛心
  for (let i = 0; i < 3; i++) {
    const hImg = i < p.hearts ? assets['heart_full'] : assets['heart_empty'];
    drawImg(hImg, 14 + i * 32, 12, 24, 24);
  }
  // 擊倒數（關卡時）
  if (state === 'LEVEL') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(12, 42, 80, 20);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px Noto Sans TC, sans-serif';
    ctx.fillText(`擊倒: ${killCount}`, 18, 56);
  }
  // 連擊數顯示 (Juicy Combo Counter)
  if (p && p.comboCount >= 2) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '900 24px "Arial Black", sans-serif';
    ctx.fillStyle = '#ffcc00';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4;
    ctx.shadowColor = 'rgba(255, 120, 0, 0.9)';
    ctx.shadowBlur = 12;
    const txt = `${p.comboCount} HITS!`;
    ctx.strokeText(txt, W / 2, 64);
    ctx.fillText(txt, W / 2, 64);
    ctx.restore();
  }
  // 目標提示
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W - 185, 10, 180, 22);
  ctx.fillStyle = '#ffe566';
  ctx.font = 'bold 13px Noto Sans TC, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('打倒魔王，救出主人！', W - 14, 25);
  ctx.textAlign = 'left';
}

function renderBossHUD() {
  if (!boss) return;
  const bw = 240, bh = 22;
  const bx = (W - bw) / 2;
  const by = 14;
  // 標題
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(bx - 4, by - 18, bw + 8, 48);
  ctx.fillStyle = '#e0eeff';
  ctx.font = 'bold 12px Noto Sans TC, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('巨大洗耳液魔王', W / 2, by - 4);
  ctx.textAlign = 'left';
  // 血量槽背景
  ctx.fillStyle = '#3a1a2a';
  ctx.fillRect(bx, by, bw, bh);
  // 血量
  ctx.fillStyle = '#e03060';
  const ratio = Math.max(0, boss.hp / boss.maxHp);
  ctx.fillRect(bx, by, bw * ratio, bh);
  // 分格
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  for (let i = 1; i < boss.maxHp; i++) {
    const ix = bx + bw * i / boss.maxHp;
    ctx.beginPath(); ctx.moveTo(ix, by); ctx.lineTo(ix, by + bh); ctx.stroke();
  }
  ctx.strokeRect(bx, by, bw, bh);
}

function renderStoryScene(scene) {
  // 深色背景
  const alpha = Math.min(1, storyTick / 20);
  ctx.fillStyle = scene === 2 ? `rgba(10,5,20,${alpha})` : `rgba(30,20,50,${alpha})`;
  ctx.fillRect(0, 0, W, H);

  const midY = H / 2 - 40;

  if (scene === 0) {
    // 主人餵食
    drawSprite(assets['owner'], OWNER_FRAME, 200, midY - 100, 80, 200);
    drawImg(assets['decor_snack'], 295, midY + 50, 36, 36);
    // Soju idle
    const sp = SOJU_FRAMES.idle;
    const f = sp.frames[Math.floor(storyTick / sp.dur) % sp.frames.length];
    drawSprite(assets['idle'], f, 370, midY + 30, 90, 80);
  } else if (scene === 1) {
    drawSprite(assets['owner'], OWNER_FRAME, 150, midY - 90, 80, 200);
    drawImg(assets['boss_cloaked'], 650, midY - 60, 90, 160);
  } else if (scene === 2) {
    drawSprite(assets['owner'], OWNER_FRAME, 220, midY - 40, 60, 150);
    drawImg(assets['cage'], 280, midY - 20, 100, 90);
    drawImg(assets['boss_cloaked'], 550, midY - 60, 80, 150);
  } else if (scene === 3) {
    drawImg(assets['boss_cloaked'], 550, midY - 60, 80, 150);
    drawImg(assets['cage'], 430, midY - 10, 100, 90);
  } else if (scene === 4) {
    // Soju 特寫
    const sp = SOJU_FRAMES.bite;
    const f = sp.frames[Math.floor(storyTick / sp.dur) % 4];
    drawSprite(assets['bite'], f, W/2 - 80, midY - 30, 160, 140);
  }
}

function renderTitle() {
  titleTick++;
  ctx.fillStyle = '#0e0a1a';
  ctx.fillRect(0, 0, W, H);

  // 星星背景
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 60; i++) {
    const sx = ((i * 137 + titleTick * 0.1) % W);
    const sy = ((i * 73) % H);
    ctx.fillRect(sx, sy, 1, 1);
  }

  // Soju 大圖
  const sp = SOJU_FRAMES.idle;
  const t = Math.floor(titleTick / sp.dur) % sp.frames.length;
  const f = sp.frames[t];
  drawSprite(assets['idle'], f, W / 2 - 80, 120, 160, 140);

  // 標題文字
  ctx.textAlign = 'center';
  ctx.font = 'bold 52px Noto Sans TC, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(180,120,255,0.8)'; ctx.shadowBlur = 20;
  ctx.fillText('Soju 大冒險', W / 2, 310);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 18px Noto Sans TC, sans-serif';
  ctx.fillStyle = '#a08080';
  ctx.fillText("Soju's Adventure", W / 2, 340);

  // 閃爍提示
  if (Math.floor(titleTick / 30) % 2 === 0) {
    ctx.font = 'bold 18px Noto Sans TC, sans-serif';
    ctx.fillStyle = '#ffe566';
    ctx.fillText('按空白鍵開始遊戲', W / 2, 420);
  }
  ctx.textAlign = 'left';
}

function renderStory() {
  storyTick++;
  renderStoryScene(storyScene);
  // 字幕
  const captions = [
    '平凡的一天，主人正在餵Soju吃最愛的零食♪',
    '咦？誰進來了...一團神祕的斗篷身影！',
    '什麼！主人被關進了狗狗運輸籠！',
    '神祕魔王帶著主人消失在門外...',
    'Soju：...哼，我來救你。（按空白鍵開始冒險）',
  ];
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, H - 90, W, 90);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 19px Noto Sans TC, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(captions[storyScene], W / 2, H - 52);
  ctx.font = '14px Noto Sans TC, sans-serif';
  ctx.fillStyle = Math.floor(storyTick / 25) % 2 === 0 ? '#ffe566' : 'rgba(255,229,102,0.4)';
  ctx.fillText('▶ 按空白鍵繼續', W / 2, H - 24);
  ctx.textAlign = 'left';
}

function renderLevel() {
  renderBackground();
  renderPlatforms();
  renderDecor();
  renderPit();
  renderEnemies();
  renderPlayer();
  VFXManager.render(ctx, cameraX);
  renderHUD();
}

function renderBossIntro() {
  // 暗紅背景
  ctx.fillStyle = '#1a0810';
  ctx.fillRect(0, 0, W, H);
  const b = boss;
  const bImg = b.revealed ? assets['boss_revealed'] : assets['boss_cloaked'];
  const bw = 160, bh = 210;
  drawImg(bImg, W / 2 - bw / 2, H / 2 - bh / 2 - 20, bw, bh);

  // 玩家
  const sp = SOJU_FRAMES.idle;
  const f = sp.frames[Math.floor(bossIntroTimer / sp.dur) % sp.frames.length];
  drawSprite(assets['idle'], f, 60, GROUND_Y - PLAYER_DRAW_H, PLAYER_DRAW_W, PLAYER_DRAW_H, false);

  // 字幕
  const caption = b.revealed
    ? '？？？：嘿嘿...原來是我，洗耳液魔王！'
    : '一團神祕的斗篷身影擋住了去路...';
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, H - 90, W, 90);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 19px Noto Sans TC, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(caption, W / 2, H - 52);
  ctx.font = '14px Noto Sans TC, sans-serif';
  ctx.fillStyle = Math.floor(bossIntroTimer / 25) % 2 === 0 ? '#ffe566' : 'rgba(255,229,102,0.4)';
  ctx.fillText('▶ 按空白鍵跳過', W / 2, H - 24);
  ctx.textAlign = 'left';
}

function renderBossRoom() {
  // 暗色房間
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a0820'); grad.addColorStop(1, '#2a1030');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 地板
  ctx.fillStyle = '#4a2030';
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#5a2838';
  for (let x = 0; x < W; x += 64) ctx.fillRect(x, GROUND_Y, 62, 4);

  renderBossCreature();
  renderPlayer();
  VFXManager.render(ctx, 0);
  renderBossHUD();
  renderHUD();
}

function renderWin() {
  winTick++;
  ctx.fillStyle = '#0a0a20';
  ctx.fillRect(0, 0, W, H);

  // 主人 + Soju 相聚
  drawSprite(assets['owner'], OWNER_FRAME, W/2 - 120, H/2 - 130, 80, 200);
  const sp = SOJU_FRAMES.idle;
  const f = sp.frames[Math.floor(winTick / sp.dur) % sp.frames.length];
  drawSprite(assets['idle'], f, W/2 - 20, H/2 + 10, 110, 96);

  // 愛心裝飾
  const hearts = ['💕', '💖', '✨', '🎉', '🐾'];
  for (let i = 0; i < hearts.length; i++) {
    const angle = (winTick * 0.03 + i * (Math.PI * 2 / hearts.length));
    const rx = W/2 + 140 * Math.cos(angle);
    const ry = H/2 - 60 + 50 * Math.sin(angle);
    ctx.font = '28px serif';
    ctx.textAlign = 'center';
    ctx.fillText(hearts[i], rx, ry);
  }

  ctx.textAlign = 'center';
  ctx.font = 'bold 38px Noto Sans TC, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(255,200,100,0.9)'; ctx.shadowBlur = 22;
  ctx.fillText('母女團聚啦！', W / 2, 100);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 26px Noto Sans TC, sans-serif';
  ctx.fillStyle = '#ffe566';
  ctx.shadowColor = 'rgba(255,200,100,0.7)'; ctx.shadowBlur = 14;
  ctx.fillText('妍霏生日快樂🎂', W / 2, 148);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
}

function renderLose() {
  ctx.fillStyle = 'rgba(10,5,20,0.9)';
  ctx.fillRect(0, 0, W, H);

  // Soju 失落表情
  const f = SOJU_FRAMES.idle.frames[0];
  drawSprite(assets['idle'], f, W/2 - 55, H/2 - 160, 110, 96);

  ctx.textAlign = 'center';
  ctx.font = 'bold 40px Noto Sans TC, sans-serif';
  ctx.fillStyle = '#ff5577';
  ctx.shadowColor = 'rgba(255,80,100,0.6)'; ctx.shadowBlur = 16;
  ctx.fillText('Soju 不爽了！', W / 2, H / 2 - 40);
  ctx.shadowBlur = 0;
  ctx.font = '20px Noto Sans TC, sans-serif';
  ctx.fillStyle = '#aaa';
  ctx.fillText('（下次一定能救到主人的...）', W / 2, H / 2 - 5);
  ctx.textAlign = 'left';
}

// ═══════════════════════════════════════════════════════════
// 11. 主迴圈
// ═══════════════════════════════════════════════════════════
let lastTime = 0;
let accum = 0;
const STEP = 1000 / 60;

function update() {
  // 打擊停頓 (Hitstop Freeze)：處於停頓時暫停世界位移與動畫更新，但震動與輸入快取保持運作
  if (Hitstop.update()) {
    CameraShake.update();
    VFXManager.update();
    InputBuffer.cleanup();
    clearJustPressed();
    return;
  }

  CameraShake.update();
  VFXManager.update();
  InputBuffer.cleanup();

  if (state === 'TITLE') {
    if (justPressed['Space']) { state = 'STORY'; storyScene = 0; storyTick = 0; }
  } else if (state === 'STORY') {
    if (justPressed['Space']) {
      storyScene++;
      storyTick = 0;
      if (storyScene >= 5) { state = 'LEVEL'; resetLevel(); }
    }
  } else if (state === 'LEVEL') {
    updateLevel();
  } else if (state === 'BOSS_INTRO') {
    updateBossIntro();
  } else if (state === 'BOSS') {
    updatePlayer();
    updateBoss();
  }
  clearJustPressed();
}

function render() {
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  // 鏡頭震動位移偏移 (Camera Shake)
  if (state === 'LEVEL' || state === 'BOSS') {
    ctx.translate(Math.round(CameraShake.offsetX), Math.round(CameraShake.offsetY));
  }
  if (state === 'TITLE') renderTitle();
  else if (state === 'STORY') renderStory();
  else if (state === 'LEVEL') renderLevel();
  else if (state === 'BOSS_INTRO') renderBossIntro();
  else if (state === 'BOSS') renderBossRoom();
  else if (state === 'WIN') renderWin();
  else if (state === 'LOSE') renderLose();
  ctx.restore();
}

function gameLoop(ts) {
  if (state === 'LOADING') return;
  accum += ts - lastTime;
  lastTime = ts;
  while (accum >= STEP) { update(); accum -= STEP; }
  render();
  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════════════════════════
// 12. 啟動
// ═══════════════════════════════════════════════════════════
document.getElementById('restartBtn').addEventListener('click', () => {
  resetLevel();
  state = 'LEVEL';
  document.getElementById('restartBtn').style.display = 'none';
  ensureAudio();
});

loadAllAssets().then(() => {
  document.getElementById('loadingScreen').style.display = 'none';
  state = 'TITLE';
  lastTime = performance.now();
  requestAnimationFrame((ts) => { lastTime = ts; requestAnimationFrame(gameLoop); });
});
</script>
