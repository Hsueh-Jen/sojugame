<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soju 大冒險 | Soju's Adventure</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap');

      overflow: hidden;
    }

      display: none;

      transform: translateX(-50%);
      padding: 14px 44px;

      color: #fff;
      background: linear-gradient(135deg, #e03060 0%, #a020c0 100%);

<body>
<div id="gameWrapper">
  <canvas id="gameCanvas" width="960" height="540"></canvas>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// 1. 全域常數
// ═══════════════════════════════════════════════════════════
const W = 960, H = 540;
const GRAVITY = 0.62;
const GROUND_Y = 460;
const PIT_START = 860, PIT_END = 955;
const LEVEL_WIDTH = 3200;
const GATE_X = 3100;
const MAX_SPEED = 4.5;       // 最大水平移動速度
const ACCEL = 0.28;          // 地面起步加速度
const DECEL = 0.32;          // 地面摩擦減速
const AIR_ACCEL = 0.22;      // 空中水平加速度
const AIR_DECEL = 0.08;      // 空中阻力減速
const TURN_BOOST = 0.45;     // 轉向煞車加成
const JUMP_V = -12.4;
const PLAYER_DRAW_W = 112, PLAYER_DRAW_H = 90;  // 放大角色渲染尺寸
const PLAYER_HIT_W = 64,  PLAYER_HIT_H = 52;    // 對應碰撞箱
const ATTACK_W = 62, ATTACK_H = 44;              // 咬擊判定放大
const ATTACK_ACTIVE = 12;
const ATTACK_COOLDOWN = 22;
const HURT_IFRAMES = 80;
const ENEMY_WINDUP_FRAMES = 55; // 數字越大，前搖時間越長（例如 50 frames 約等於 0.8 秒）

// 統一 soju.jpeg（1024×1024，前兩列 4 幀、後三列 3 幀，灰底）切圖。
// 4 幀列寬 256px；3 幀列寬約 341px，不能共用同一組 sx/sw。
const SOJU_FOUR_FRAME_W = 256;
const SOJU_THREE_FRAME_W = 341;
function sojuAnim(dur, sy, sxList, frameWidth, frameHeight, loop = true) {
  return {
    dur, loop,
    frames: sxList.map(sx => ({ sx, sy, sw: frameWidth, sh: frameHeight })),
  };
}
function sojuAnimFrames(dur, frames, loop = true) {
  return { dur, loop, frames };
}
const SOJU_FRAMES = {
  idle:         sojuAnim(16,   0, [0, 256], SOJU_FOUR_FRAME_W, 205),
  run:          sojuAnim(7,  205, [0, 256, 512], SOJU_FOUR_FRAME_W, 205),
  jump:         sojuAnimFrames(8, [{ sx: 0, sy: 0, sw: 1, sh: 1 }], false),
  // 頭鎚第三幀是頭部前伸的重擊姿勢，必須在一次攻擊期間播放到。
  attack_head:  sojuAnimFrames(4, [{ sx: 20, sy: 430, sw: 246, sh: 184 }], false),
  attack_punch: sojuAnimFrames(7, [
    { sx: 20, sy: 614, sw: 255, sh: 205 },
    { sx: 270, sy: 614, sw: 250, sh: 205 },
  ], false),
  attack_kick:  sojuAnimFrames(10, [
    { sx: 10, sy: 839, sw: 230, sh: 185 },
    { sx: 285, sy: 839, sw: 190, sh: 185 },
    { sx: 530, sy: 850, sw: 160, sh: 174 },
  ], false),
  hurt:         sojuAnimFrames(12, [{ sx: 10, sy: 839, sw: 230, sh: 185 }], false),
  bite:         sojuAnimFrames(6, [
    { sx: 20, sy: 430, sw: 246, sh: 184 },
    { sx: 317, sy: 430, sw: 223, sh: 184 },
    { sx: 594, sy: 471, sw: 296, sh: 143 },
  ]),
};
const OWNER_FRAME = { sx: 410, sy: 30, sw: 280, sh: 890 };

// ═══════════════════════════════════════════════════════════
// 2. 素材載入器
// ═══════════════════════════════════════════════════════════
const assets = {};
let assetsLoaded = 0;
const SOJU_ACTION_FRAME_COUNTS = {
  idle: 2, run: 3, jump: 1, attack_head: 1, attack_punch: 2, attack_kick: 3, hurt: 1,
};
const BOSS_ACTION_FRAME_COUNTS = {
  idle: 4, move: 4, attack: 3, spray: 3,
};
const TOTAL_ASSETS = 28 + 14; // 14 boss frames
const KENNEY_TILE_SIZE = 18;
const KENNEY_BACKGROUND_TILE_SIZE = 24;
const KENNEY_CHARACTER_TILE_SIZE = 24;
const CUSTOM_LEVEL_TILE_SIZE = 36;
let customLevel = null;
let customPlatforms = [];
let activeLevelWidth = LEVEL_WIDTH;
let activeGateX = GATE_X;
let activeGroundY = GROUND_Y;
let cameraY = 0;

function updateLoadingBar() {
  assetsLoaded++;
  document.getElementById('loadingBar').style.width = (assetsLoaded / TOTAL_ASSETS * 100) + '%';
}

function loadImage(name, src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { assets[name] = img; updateLoadingBar(); resolve(); };
    img.onerror = () => { console.warn('Failed to load:', src); updateLoadingBar(); resolve(); };
    img.src = src;
  });
}

function loadWithChromaKey(name, src, targetBg, tol = 26) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const oc = document.createElement('canvas');
      oc.width = img.width; oc.height = img.height;
      const octx = oc.getContext('2d');
      octx.drawImage(img, 0, 0);
      const d = octx.getImageData(0, 0, img.width, img.height);
      const px = d.data;
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i], g = px[i+1], b = px[i+2];
        const isGray = Math.abs(r-g) <= 16 && Math.abs(g-b) <= 16;
        const matchBg = Math.abs(r-targetBg[0]) <= tol && Math.abs(g-targetBg[1]) <= tol && Math.abs(b-targetBg[2]) <= tol;
        if (isGray && matchBg) px[i+3] = 0;
      }
      octx.putImageData(d, 0, 0);
      assets[name] = oc;
      updateLoadingBar();
      resolve();
    };
    img.onerror = () => { updateLoadingBar(); resolve(); };
    img.src = src;
  });
}

async function loadAllAssets() {
  const sojuFrameLoads = Object.entries(SOJU_ACTION_FRAME_COUNTS).flatMap(([action, count]) =>
    Array.from({ length: count }, (_, index) => {
      const frame = String(index + 1).padStart(2, '0');
      return loadImage(`soju_${action}_${index + 1}`, `imgs/soju/${action}/frame_${frame}.png`);
    })
  );
  const bossFrameLoads = Object.entries(BOSS_ACTION_FRAME_COUNTS).flatMap(([action, count]) =>
    Array.from({ length: count }, (_, index) => {
      const frame = String(index + 1).padStart(2, '0');
      return loadImage(`boss_${action}_${index + 1}`, `imgs/boss/${action}/frame_${frame}.png`);
    })
  );
  await Promise.all([
    loadWithChromaKey('owner',        'imgs/owner.jpeg',        [123,123,123]),
    loadImage('kenney_tiles',       'imgs/kenney_pixel-platformer/Tilemap/tilemap_packed.png'),
    loadImage('kenney_backgrounds', 'imgs/kenney_pixel-platformer/Tilemap/tilemap-backgrounds_packed.png'),
    loadImage('kenney_characters',  'imgs/kenney_pixel-platformer/Tilemap/tilemap-characters_packed.png'),
    loadImage('cage',          'imgs/cage.png'),
    loadImage('heart_full',    'imgs/heart_full.png'),
    loadImage('heart_empty',   'imgs/heart_empty.png'),
    loadImage('scene01',       'imgs/scene01.jpg'),
    loadImage('scene02',       'imgs/scene02.jpeg'),
    loadImage('scene03',       'imgs/scene03.jpeg'),
    loadImage('scene04',       'imgs/scene04.jpeg'),
    loadImage('scene05',       'imgs/scene05.jpeg'),
    loadImage('scene06',       'imgs/scene06.jpeg'),
    ...sojuFrameLoads,
    ...bossFrameLoads,
  ]);
}

function sojuFrameImage(action, frameIndex) {
  const sourceAction = action === 'bite' ? 'attack_head' : action;
  const frameCount = SOJU_ACTION_FRAME_COUNTS[sourceAction] || 1;
  return assets[`soju_${sourceAction}_${(frameIndex % frameCount) + 1}`];
}

function bossFrameImage(action, frameIndex) {
  const frameCount = BOSS_ACTION_FRAME_COUNTS[action] || 1;
  const assetName = `boss_${action}_${(frameIndex % frameCount) + 1}`;
  let img = assets[assetName];
  if (!img) {
    console.warn(`Boss asset not found: ${assetName}`);
    img = assets[`boss_${action}_1`]; // 缺圖時退回本動作第一張，維持視覺一致
  }
  return img;
}

function drawSojuFrame(action, frameIndex, dx, dy, anchorW, targetH, flipX = false) {
  const img = sojuFrameImage(action, frameIndex);
  if (!img) return;
  const drawH = targetH;
  const drawW = drawH * (img.width / img.height);
  const drawX = flipX ? dx + anchorW - drawW : dx;
  drawImg(img, drawX, dy, drawW, drawH, flipX);
}

// ═══════════════════════════════════════════════════════════
// 3. 音效系統
// ═══════════════════════════════════════════════════════════
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function tone(type, freqStart, freqEnd, duration, vol = 0.18) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.start(); osc.stop(audioCtx.currentTime + duration + 0.01);
}
const SFX = {
  jump:     () => tone('square',   440, 880, 0.12),
  bite:     () => tone('sawtooth', 200,  70, 0.07),
  hurt:     () => tone('sawtooth', 320, 110, 0.22),
  kill:     () => tone('square',   500, 900, 0.08),
  bosshit:  () => tone('square',   160,  95, 0.16),
  // 打擊感音效模組
  hitLight: () => { tone('triangle', 260, 60, 0.08, 0.24); tone('sawtooth', 200, 50, 0.05, 0.18); },
  hitHeavy: () => { tone('triangle', 150, 35, 0.18, 0.38); tone('sawtooth', 280, 35, 0.12, 0.26); },
  launch:   () => tone('sine', 180, 820, 0.16, 0.24),
  airHit:   () => { tone('triangle', 340, 90, 0.08, 0.22); tone('square', 450, 130, 0.05, 0.16); },
  cancel:   () => tone('sine', 520, 800, 0.06, 0.15),
};
const NOTE_FREQ = {C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,Bb4:466.16,C5:523.25};
const BIRTHDAY = [
  ['C4',.75],['C4',.25],['D4',1],['C4',1],['F4',1],['E4',2],
  ['C4',.75],['C4',.25],['D4',1],['C4',1],['G4',1],['F4',2],
  ['C4',.75],['C4',.25],['C5',1],['A4',1],['F4',1],['E4',1],['D4',2],
  ['Bb4',.75],['Bb4',.25],['A4',1],['F4',1],['G4',1],['F4',2],
];
let birthdayPlayed = false;
function playBirthday() {
  if (!audioCtx || birthdayPlayed) return;
  birthdayPlayed = true;
  let t = audioCtx.currentTime + 0.1;
  const beat = 0.42;
  for (const [note, len] of BIRTHDAY) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.value = NOTE_FREQ[note];
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + len * beat * 0.9);
    osc.start(t); osc.stop(t + len * beat);
    t += len * beat;
  }
  // loop once more
  t += 0.5;
  for (const [note, len] of BIRTHDAY) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.value = NOTE_FREQ[note];
    g.gain.setValueAtTime(0.14, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + len * beat * 0.9);
    osc.start(t); osc.stop(t + len * beat);
    t += len * beat;
  }
}

// ═══════════════════════════════════════════════════════════
// 4. 繪製工具函式
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

function drawSprite(img, frame, dx, dy, dw, dh, flipX = false) {
  if (!img) return;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (flipX) {
    ctx.translate(Math.round(dx + dw), Math.round(dy));
    ctx.scale(-1, 1);
    ctx.drawImage(img, frame.sx, frame.sy, frame.sw, frame.sh, 0, 0, dw, dh);
  } else {
    ctx.drawImage(img, frame.sx, frame.sy, frame.sw, frame.sh, Math.round(dx), Math.round(dy), dw, dh);
  }
  ctx.restore();
}

function drawImg(img, dx, dy, dw, dh, flipX = false) {
  if (!img) return;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (flipX) {
    ctx.translate(Math.round(dx + dw), Math.round(dy));
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0, dw, dh);
  } else {
    ctx.drawImage(img, Math.round(dx), Math.round(dy), dw, dh);
  }
  ctx.restore();
}

function drawKenneyTile(sheet, tileIndex, dx, dy, scale = 1) {
  if (!sheet) return;
  const columns = sheet.width / KENNEY_TILE_SIZE;
  const sx = (tileIndex % columns) * KENNEY_TILE_SIZE;
  const sy = Math.floor(tileIndex / columns) * KENNEY_TILE_SIZE;
  ctx.drawImage(sheet, sx, sy, KENNEY_TILE_SIZE, KENNEY_TILE_SIZE,
    Math.round(dx), Math.round(dy), KENNEY_TILE_SIZE * scale, KENNEY_TILE_SIZE * scale);
}

function drawKenneyBackgroundTile(tileIndex, dx, dy) {
  const sheet = assets['kenney_backgrounds'];
  if (!sheet) return;
  const columns = sheet.width / KENNEY_BACKGROUND_TILE_SIZE;
  const sx = (tileIndex % columns) * KENNEY_BACKGROUND_TILE_SIZE;
  const sy = Math.floor(tileIndex / columns) * KENNEY_BACKGROUND_TILE_SIZE;
  ctx.drawImage(sheet, sx, sy, KENNEY_BACKGROUND_TILE_SIZE, KENNEY_BACKGROUND_TILE_SIZE,
    Math.round(dx), Math.round(dy), KENNEY_BACKGROUND_TILE_SIZE, KENNEY_BACKGROUND_TILE_SIZE);
}

function drawKenneyCharacterTile(tileIndex, dx, dy, dw, dh, flipX = false) {
  const sheet = assets['kenney_characters'];
  if (!sheet) return;
  const sx = (tileIndex % 9) * KENNEY_CHARACTER_TILE_SIZE;
  const sy = Math.floor(tileIndex / 9) * KENNEY_CHARACTER_TILE_SIZE;
  ctx.save();
  if (flipX) {
    ctx.translate(Math.round(dx + dw), Math.round(dy));
    ctx.scale(-1, 1);
    ctx.drawImage(sheet, sx, sy, KENNEY_CHARACTER_TILE_SIZE, KENNEY_CHARACTER_TILE_SIZE, 0, 0, dw, dh);
  } else {
    ctx.drawImage(sheet, sx, sy, KENNEY_CHARACTER_TILE_SIZE, KENNEY_CHARACTER_TILE_SIZE,
      Math.round(dx), Math.round(dy), dw, dh);
  }
  ctx.restore();
}

function drawCustomTile(sheetName, tileIndex, dx, dy) {
  if (!tileIndex) return;
  const sheet = assets[sheetName];
  const size = sheetName === 'kenney_backgrounds' ? KENNEY_BACKGROUND_TILE_SIZE : KENNEY_TILE_SIZE;
  const columns = Math.floor(sheet.width / size);
  const index = tileIndex - 1;
  const sx = (index % columns) * size;
  const sy = Math.floor(index / columns) * size;
  ctx.drawImage(sheet, sx, sy, size, size, Math.round(dx), Math.round(dy), CUSTOM_LEVEL_TILE_SIZE, CUSTOM_LEVEL_TILE_SIZE);
}

function loadCustomLevel() {
  const saved = localStorage.getItem('soju-custom-level');
  if (!saved) return false;
  try {
    const candidate = JSON.parse(saved);
    if (!candidate || !Number.isInteger(candidate.width) || !Number.isInteger(candidate.height) || !candidate.layers) return false;
    const total = candidate.width * candidate.height;
    if (!Array.isArray(candidate.layers.tiles) || candidate.layers.tiles.length !== total) return false;
    if (!Array.isArray(candidate.layers.backgrounds) || candidate.layers.backgrounds.length !== total) candidate.layers.backgrounds = Array(total).fill(0);
    if (!Array.isArray(candidate.layers.characters) || candidate.layers.characters.length !== total) candidate.layers.characters = Array(total).fill(0);
    if (!Array.isArray(candidate.layers.boss) || candidate.layers.boss.length !== total) candidate.layers.boss = Array(total).fill(0);
    customLevel = candidate;
    activeLevelWidth = customLevel.width * CUSTOM_LEVEL_TILE_SIZE;
    activeGroundY = customLevel.height * CUSTOM_LEVEL_TILE_SIZE;
    activeGateX = Math.max(W + 80, activeLevelWidth - 120);
    customPlatforms = [];
    for (let row = 0; row < customLevel.height; row++) {
      let start = -1;
      for (let col = 0; col <= customLevel.width; col++) {
        const occupied = col < customLevel.width && customLevel.layers.tiles[row * customLevel.width + col] > 0;
        if (occupied && start < 0) start = col;
        if ((!occupied || col === customLevel.width) && start >= 0) {
          customPlatforms.push({
            x: start * CUSTOM_LEVEL_TILE_SIZE,
            y: row * CUSTOM_LEVEL_TILE_SIZE,
            w: (col - start) * CUSTOM_LEVEL_TILE_SIZE,
            h: CUSTOM_LEVEL_TILE_SIZE,
            sprite: 'custom'
          });
          start = -1;
        }
      }
    }
    return true;
  } catch (error) {
    console.warn('Failed to load custom level:', error);
    return false;
  }
}

// ═══════════════════════════════════════════════════════════
// 5. 關卡資料
// ═══════════════════════════════════════════════════════════
const PLATFORMS = [
  { x: 0,       y: GROUND_Y, w: PIT_START,             h: 80, sprite: 'floor' },
  { x: PIT_END, y: GROUND_Y, w: LEVEL_WIDTH - PIT_END, h: 80, sprite: 'floor' },
  { x: 300,     y: 390,      w: 144, h: 18, sprite: 'kenney' },
  { x: 1180,    y: 370,      w: 162, h: 18, sprite: 'kenney' },
  { x: 2020,    y: 400,      w: 126, h: 18, sprite: 'kenney' },
];

const DECOR_DEFS = [
  { type: 'tree',        x: 180,    y: GROUND_Y - 108, w: 90,  h: 108 },
  { type: 'tree',        x: 760,    y: GROUND_Y - 90,  w: 72,  h: 90 },
  { type: 'tree',        x: 1450,   y: GROUND_Y - 126, w: 108, h: 126 },
  { type: 'tree',        x: 2200,   y: GROUND_Y - 108, w: 90,  h: 108 },
  { type: 'tree',        x: 2780,   y: GROUND_Y - 126, w: 108, h: 126 },
  { type: 'gate',        x: GATE_X, y: GROUND_Y - 72,  w: 72,  h: 72 },
];

function makeEnemyDefs() {
  const EH = 58, EW = 88;
  if (customLevel && customLevel.layers && customLevel.layers.characters) {
    const enemies = [];
    const charLayer = customLevel.layers.characters;
    for (let row = 0; row < customLevel.height; row++) {
      for (let col = 0; col < customLevel.width; col++) {
        const charIdx = charLayer[row * customLevel.width + col];
        if (charIdx > 0) {
          const ex = col * CUSTOM_LEVEL_TILE_SIZE;
          const groundY = (row + 1) * CUSTOM_LEVEL_TILE_SIZE;
          const ey = groundY - EH; // 腳底對齊格子底部
          enemies.push({
            type: 'slipper',
            x: ex, y: ey, w: EW, h: EH,
            dir: 1, range: [ex - 100, ex + 100],
            speed: 1, pause: 0, baseY: ey,
            hp: 3, maxHp: 3
          });
        }
      }
    }
    return enemies;

// 6.1 Hitbox 與 Hurtbox 碰撞與接觸點 (Contact Point)
class Hitbox {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
  }
  static checkOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }
  // 計算兩個包圍盒重疊區域的幾何中心點 (Contact Point)
  static getContactPoint(a, b) {
    const minX = Math.max(a.x, b.x);
    const maxX = Math.min(a.x + a.w, b.x + b.w);
    const minY = Math.max(a.y, b.y);
    const maxY = Math.min(a.y + a.h, b.y + b.h);
    return {
      x: (minX + maxX) / 2,
      y: (minY + maxY) / 2
    };
  }
}

// 6.2 打擊停頓模組 (Hitstop / Frame Freeze)
// 命中間隔 3-7 幀凍結主邏輯與動畫位移，產生極沉重之打擊肉感
const Hitstop = {
  frames: 0,
  trigger(f) {
    this.frames = Math.max(this.frames, f);
  },
  update() {
    if (this.frames > 0) {
      this.frames--;
      return true; // 正在 Hitstop 凍結中
    }
    return false;
  }
};

// 6.3 輕量級隨機震屏模組 (Camera Shake)
const CameraShake = {
  trauma: 0,
  offsetX: 0,
  offsetY: 0,
  decay: 0.80,

  shake(amount) {
    this.trauma = Math.min(10, Math.max(this.trauma, amount));
  },

  update() {
    if (this.trauma > 0.25) {
      const angle = Math.random() * Math.PI * 2;
      const dist = this.trauma * (0.6 + Math.random() * 0.4);
      this.offsetX = Math.cos(angle) * dist;
      this.offsetY = Math.sin(angle) * dist;
      this.trauma *= this.decay;
    } else {
      this.offsetX = 0;
      this.offsetY = 0;
      this.trauma = 0;
    }
  }
};

// 6.4 動態輸入快取模組 (Input Buffering ~150ms)
const InputBuffer = {
  queue: [],
  BUFFER_MS: 150, // 150ms 視窗

  push(action) {
    this.queue.push({ action, time: performance.now() });
    if (this.queue.length > 12) this.queue.shift();
  },

  has(action) {
    const now = performance.now();
    return this.queue.some(item => item.action === action && (now - item.time) <= this.BUFFER_MS);
  },

  consume(action) {
    const now = performance.now();
    const idx = this.queue.findIndex(item => item.action === action && (now - item.time) <= this.BUFFER_MS);
    if (idx !== -1) {
      this.queue.splice(idx, 1);
      return true;
    }
    return false;
  },

  cleanup() {
    const now = performance.now();
    this.queue = this.queue.filter(item => (now - item.time) <= this.BUFFER_MS);
  },

  clear() {
    this.queue = [];
  }
};

// 6.6 視覺特效與打擊點 Hook 系統 (VFX Spawn Hooks)
const VFXManager = {
  particles: [],
  rings: [],
  slashes: [],
  floatingTexts: [],
  hooks: [],

  // 外部事件監聽註冊 Hook
  onHit(fn) {
    this.hooks.push(fn);
  },

  // 觸發打擊特效廣播
  emitHit(event) {
    // 執行已註冊的 Hook 監聽器
    for (const hook of this.hooks) {
      try { hook(event); } catch (e) { console.error('VFX Hook error:', e); }
    }

    const { contactX, contactY, move, isKill, facing } = event;
    const isHeavy = move.id === 'uppercut' || isKill;

    // 1. 打擊火花 (Hit Sparks)
    const sparkCount = isHeavy ? 14 : 7;
    for (let i = 0; i < sparkCount; i++) {
      const baseAngle = facing > 0 ? 0 : Math.PI;
      const spread = (Math.random() - 0.5) * 1.5;
      const angle = baseAngle + spread;

        x: contactX,
        y: contactY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (Math.random() * 2.5),
        life: 14 + Math.floor(Math.random() * 8),
        maxLife: 22,
        size: isHeavy ? (3 + Math.random() * 3) : (2 + Math.random() * 2),
        color: isHeavy ? ['#ffffff', '#ffea00', '#ff3b30'][i % 3] : ['#ffffff', '#ffe566', '#ff9500'][i % 3]
      });
    }

    // 2. 擴散衝擊氣浪環 (Impact Ring)
    this.rings.push({
      x: contactX,
      y: contactY,
      radius: 6,
      maxRadius: isHeavy ? 38 : 22,
      alpha: 1,
      color: isHeavy ? '#fff066' : '#ffffff',
      lineWidth: isHeavy ? 4 : 2
    });

    // 3. 抓痕/咬痕光弧 (Slash Arc)
    this.slashes.push({
      x: contactX,
      y: contactY,
      facing: facing,
      angle: isHeavy ? -Math.PI / 4 : 0,
      length: isHeavy ? 45 : 30,
      life: 8,
      maxLife: 8,
      color: isHeavy ? '#ffdd44' : '#ffffff'
    });

    // 4. 浮動打擊文字 (Combo / Damage text)
    let txt = '';
    let txtColor = '#ffffff';
    if (isKill) {
      txt = 'K.O.!';
      txtColor = '#ff3b30';
    } else if (move.id === 'uppercut') {
      txt = 'LAUNCH!';
      txtColor = '#ff9500';
    } else if (event.comboCount >= 2) {
      txt = `${event.comboCount} HITS!`;
      txtColor = '#ffcc00';
    }
    if (txt) {
      this.floatingTexts.push({
        text: txt,
        x: contactX,
        y: contactY - 14,
        vy: -1.6,
        life: 32,
        maxLife: 32,
        color: txtColor,
        scale: isHeavy ? 1.3 : 1.0
      });
    }
  },

  spawnJumpCancelDust(x, y) {
    for (let i = 0; i < 6; i++) {
      this.particles.push({
        x: x + (Math.random() - 0.5) * 20,
        y: y,
        vx: (Math.random() - 0.5) * 4,
        vy: -Math.random() * 2.5,
        life: 12,
        maxLife: 12,
        size: 3,
        color: 'rgba(255, 230, 180, 0.8)'
      });
    }
  },

  update() {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18;
      p.life--;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.radius += (r.maxRadius - r.radius) * 0.32;
      r.alpha -= 0.1;
      if (r.alpha <= 0) this.rings.splice(i, 1);
    }
    for (let i = this.slashes.length - 1; i >= 0; i--) {
      const s = this.slashes[i];
      s.life--;
      if (s.life <= 0) this.slashes.splice(i, 1);
    }
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const t = this.floatingTexts[i];
      t.y += t.vy;
      t.vy *= 0.92;
      t.life--;
      if (t.life <= 0) this.floatingTexts.splice(i, 1);
    }
  },

render(ctx, camX, camY = 0) {    ctx.save();
    // 氣浪環
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      
      ctx.beginPath();
      // 💡 補上 camY (若沒傳入預設為 0)，確保 Y 軸精準對齊 Boss
      ctx.arc(r.x - camX, r.y - (camY || 0), r.radius, 0, Math.PI * 2);
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.lineWidth;
      ctx.globalAlpha = Math.max(0, r.alpha);
      ctx.stroke();

      // 💡 動畫更新：讓氣浪環朝中心快速縮小，產生「吸氣/蓄力」視覺感
      r.radius -= 2.5;
      r.alpha -= 0.02;

      // 圈圈縮到極小或變透明後自動刪除
      if (r.radius <= (r.maxRadius || 5) || r.alpha <= 0) {
        this.rings.splice(i, 1);
      }
    }
    // 光弧
    for (const s of this.slashes) {
      const progress = 1 - (s.life / s.maxLife);
      ctx.save();
      ctx.translate(s.x - camX, s.y);
      if (s.facing < 0) ctx.scale(-1, 1);
      ctx.rotate(s.angle);
      ctx.beginPath();
      ctx.arc(0, 0, s.length, -Math.PI / 4, Math.PI / 4);
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 3 * (1 - progress);
      ctx.globalAlpha = 1 - progress;
      ctx.stroke();
      ctx.restore();
    }
    // 打擊火花
    for (const p of this.particles) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.beginPath();
      ctx.arc(p.x - camX, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    // 浮動文字
    for (const t of this.floatingTexts) {
      const alpha = Math.max(0, t.life / t.maxLife);
      ctx.save();
      ctx.font = `bold ${Math.round(15 * t.scale)}px 'Arial Black', sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = t.color;
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 3;
      ctx.globalAlpha = alpha;
      ctx.strokeText(t.text, t.x - camX, t.y);
      ctx.fillText(t.text, t.x - camX, t.y);
      ctx.restore();
    }
    ctx.restore();
  }
};

// 9. 碰撞工具
// ═══════════════════════════════════════════════════════════
function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

function platformLand(p) {
  if (p.vy < 0) return;
  const px = p.x, py = p.y + PLAYER_HIT_H;
  const platforms = customLevel ? customPlatforms : PLATFORMS;
  for (const plat of platforms) {
    if (px + PLAYER_HIT_W > plat.x && px < plat.x + plat.w) {
      const prevBottom = py - p.vy;
      if (prevBottom <= plat.y && py >= plat.y) {
        p.y = plat.y - PLAYER_HIT_H;
        p.vy = 0;
        p.onGround = true;
        p.airAttackUsed = false;
        return;
      }
    }
  }
}

function resolveHorizontalCollisions(p, previousX) {
  const platforms = customLevel ? customPlatforms : PLATFORMS;
  for (const plat of platforms) {
    const overlapsY = p.y < plat.y + plat.h && p.y + PLAYER_HIT_H > plat.y;
    if (!overlapsY) continue;
    if (p.vx > 0 && previousX + PLAYER_HIT_W <= plat.x && p.x + PLAYER_HIT_W > plat.x) {
      p.x = plat.x - PLAYER_HIT_W;
      p.vx = 0;
    } else if (p.vx < 0 && previousX >= plat.x + plat.w && p.x < plat.x + plat.w) {
      p.x = plat.x + plat.w;
      p.vx = 0;
    }
  }
}

// ═══════════════════════════════════════════════════════════
function updatePlayer() {
  const p = player;
  // 移動與加速度計算
  let moveInput = 0;
  if (keys['ArrowLeft'] || keys['a']) moveInput -= 1;
  if (keys['ArrowRight'] || keys['d']) moveInput += 1;

  const currentAccel = p.onGround ? ACCEL : AIR_ACCEL;
  const currentDecel = p.onGround ? DECEL : AIR_DECEL;

  if (moveInput !== 0) {
    p.facing = moveInput > 0 ? 1 : -1;
    // 轉向煞車加成
    if ((moveInput > 0 && p.vx < 0) || (moveInput < 0 && p.vx > 0)) {
      p.vx += moveInput * (currentAccel + TURN_BOOST);
    } else {
      p.vx += moveInput * currentAccel;
    }
    // 限制最大速度
    if (Math.abs(p.vx) > MAX_SPEED) {
      p.vx = Math.sign(p.vx) * MAX_SPEED;
    }
  } else {
    // 鬆開按鍵時摩擦減速滑行
    if (Math.abs(p.vx) <= currentDecel) {
      p.vx = 0;
    } else {
      p.vx -= Math.sign(p.vx) * currentDecel;
    }
  }
  const moving = Math.abs(p.vx) > 0.25;

  // ══════════════════════════════════════════
  // 動態輸入快取檢測 (Input Buffer)
  // ══════════════════════════════════════════
  const wantsJump = justPressed['ArrowUp'] || justPressed['w'] || InputBuffer.has('jump');
  const wantsAttack = justPressed['Space'] || InputBuffer.has('attack');
  const isHoldingUp = keys['ArrowUp'] || keys['w'];

  // 1. 跳躍取消 (Jump Cancel) 機制：
  // 招式命中判定成功後，可在後搖期間立刻透過跳躍取消，進入空中連擊追擊 (Air Combo)！
  if (p.attackFrames > 0 && p.attackHasHit && p.jumpCancelable && wantsJump && p.onGround) {
    p.attackFrames = 0;
    p.attackCooldown = 0;
    p.attackMove = null;
    p.vy = JUMP_V;
    p.onGround = false;
    InputBuffer.consume('jump');
    SFX.jump();
    SFX.cancel();
    VFXManager.spawnJumpCancelDust(p.x + PLAYER_HIT_W / 2, p.y + PLAYER_HIT_H);
  } else if (p.onGround && wantsJump && p.attackFrames <= 0) {
    p.vy = JUMP_V;
    p.onGround = false;
    p.airAttackUsed = false;
    InputBuffer.consume('jump');
    SFX.jump();
  }

  // 2. 攻擊判定與連招取消 (Combo Cancel: 用頭頂 -> 用手揍 -> 迴旋踢)
  const canNormalAttack = p.attackFrames <= 0 && p.attackCooldown <= 0;
  const canComboCancel = p.attackFrames > 0 && p.attackHasHit && p.canComboCancel;

  if (wantsAttack && (canNormalAttack || canComboCancel) && (p.onGround || !p.airAttackUsed)) {
    InputBuffer.consume('attack');

    let chosenMove = null;
    if (!p.onGround && !p.airAttackUsed) {
      // 空中飛踢 (Aerial Kick)：給予向上滯空懸浮力，維持空中連段
      chosenMove = ATTACK_TYPES.AERIAL;
      p.vy = Math.min(p.vy, -2.8);
      p.airAttackUsed = true;
    } else if (p.comboStage === 2 || isHoldingUp) {
      // 第三擊（或按住上）：迴旋踢 (Spin Kick) - 敵人會飛比較遠！
      chosenMove = ATTACK_TYPES.KICK;
      p.comboStage = 0;
      p.comboTimer = 0;
      p.vx = p.facing * 3.2; // 迴旋踢向前大踏步衝刺
    } else if (p.comboStage === 1) {
      // 第二擊：用手揍 (Punch)
      chosenMove = ATTACK_TYPES.PUNCH;
      p.comboStage = 2;
      p.comboTimer = 28;
      p.vx = p.facing * 1.5;
    } else {
      // 第一擊：用頭頂 (Headbutt)
      chosenMove = ATTACK_TYPES.HEAD;
      p.comboStage = 1;
      p.comboTimer = 24;
      p.vx = p.facing * 2.2; // 頭頂前頂位移
    }

    p.attackMove = chosenMove;
    p.attackFrames = chosenMove.activeFrames;
    p.attackCooldown = chosenMove.recoveryFrames;
    p.attackHasHit = false;
    p.jumpCancelable = false;
    p.canComboCancel = false;
    p.anim = chosenMove.anim;
    p.animTick = 0;
    p.animFrame = 0;

    // 重置所有敵人的受擊標記，確保新的一擊能命中
    for (const e of enemies) e.hasBeenHitThisAttack = false;

    if (SFX[chosenMove.sfx]) SFX[chosenMove.sfx]();
  }

  // 連招間隔與計數器逾時重置
  if (p.comboTimer > 0) {
    p.comboTimer--;
    if (p.comboTimer <= 0) p.comboStage = 0;
  }
  if (p.comboResetTimer > 0) {
    p.comboResetTimer--;
    if (p.comboResetTimer <= 0) p.comboCount = 0;
  }

  if (p.attackFrames > 0) p.attackFrames--;
  if (p.attackCooldown > 0) p.attackCooldown--;
  if (p.hurtFrames > 0) p.hurtFrames--;

  // 物理
  p.vy += GRAVITY;
  const previousX = p.x;
  p.x += p.vx;
  p.y += p.vy;
  resolveHorizontalCollisions(p, previousX);

  // 邊界
  p.x = Math.max(0, Math.min(activeLevelWidth - PLAYER_HIT_W, p.x));

  // 平台碰撞
  p.onGround = false;
  if (p.y + PLAYER_HIT_H > activeGroundY) {
    // 黑暗玩具坑 - 掉到地圖最下方一律視為坑洞
    const centerX = p.x + PLAYER_HIT_W / 2;
    if (centerX > PIT_START && centerX < PIT_END) {
      // 掉坑 - 摔死扣一滴血
      hurtPlayer();
      // 尋找左側最近安全點
    let safeX = 60; // 預設防呆起點
    let safeY = activeGroundY - PLAYER_HIT_H - 80;

    if (customLevel) {
      const TILE_SIZE = CUSTOM_LEVEL_TILE_SIZE;
      let startCol = Math.floor(p.x / TILE_SIZE);
      let foundPlatform = false;

      // 從玩家當前 X 位置往左掃描 Tile 網格
      for (let col = startCol; col >= 0; col--) {
        // 由上往下尋找該行最高（最先遇到）的實體 Tile
        for (let row = 0; row < customLevel.height; row++) {
          const tileId = customLevel.layers.tiles[row * customLevel.width + col];
          if (tileId > 0) {
            // 找到該列最高處的平台 Tile
            safeX = col * TILE_SIZE + (TILE_SIZE - PLAYER_HIT_W) / 2;
            // 計算高點 (多減 70px 確保從高處落下，避免卡地)
            safeY = row * TILE_SIZE - PLAYER_HIT_H - 70; 
            foundPlatform = true;
            break;
          }
        }
        if (foundPlatform) break; // 找到最近的左側平台就停止搜尋
      }
    } else {
      // 預設關卡：重生在坑洞左側邊緣上方高處
      safeX = Math.max(60, PIT_START - 60);
      safeY = activeGroundY - PLAYER_HIT_H - 80;
    }

    // 套用重生座標與動態狀態
    p.x = safeX;
    p.y = safeY;
    p.vx = 0;
    p.vy = 0;             // 重置速度
    p.onGround = false;   // 設為在空中，產生自然落下的效果
    p.airAttackUsed = false;
    }
  }
  
// 檢查是否掉到地圖最下方
if (p.y > H + 50) {
  hurtPlayer();
  
  let safeX = 60;
  let safeY = activeGroundY - PLAYER_HIT_H - 80;

  if (customLevel) {
    const TILE_SIZE = CUSTOM_LEVEL_TILE_SIZE;
    let startCol = Math.floor(p.x / TILE_SIZE);
    let foundPlatform = false;

    for (let col = startCol; col >= 0; col--) {
      for (let row = 0; row < customLevel.height; row++) {
        if (customLevel.layers.tiles[row * customLevel.width + col] > 0) {
          safeX = col * TILE_SIZE + (TILE_SIZE - PLAYER_HIT_W) / 2;
          safeY = row * TILE_SIZE - PLAYER_HIT_H - 70;
          foundPlatform = true;
          break;
        }
      }
      if (foundPlatform) break;
    }
  }

  p.x = safeX;
  p.y = safeY;
  p.vx = 0;
  p.vy = 0;
  p.onGround = false;
  p.airAttackUsed = false;
}
  platformLand(p);

  // 動畫狀態
  let newAnim = 'idle';
  if (p.attackFrames > 0 && p.attackMove) newAnim = p.attackMove.anim;
  else if (!p.onGround) newAnim = 'jump';
  else if (moving) newAnim = 'run';

  if (p.hurtFrames > HURT_IFRAMES - 24 && p.attackFrames <= 0) newAnim = 'hurt';

  if (newAnim !== p.anim) { p.anim = newAnim; p.animTick = 0; p.animFrame = 0; }
  const animDef = SOJU_FRAMES[p.anim] || SOJU_FRAMES.idle;
  p.animTick++;
  if (p.animTick >= animDef.dur) {
    p.animTick = 0;
    const last = animDef.frames.length - 1;
    if (animDef.loop === false) p.animFrame = Math.min(p.animFrame + 1, last);
    else p.animFrame = (p.animFrame + 1) % animDef.frames.length;
  }
}

function hurtPlayer() {
  const p = player;
  if (p.hurtFrames > 0) return;
  p.hearts--;
  p.hurtFrames = HURT_IFRAMES;
  SFX.hurt();
  CameraShake.shake(4.5);
  if (p.hearts <= 0) {
    state = 'LOSE';
    document.getElementById('restartBtn').style.display = 'block';
  }
}

/**
 * 1. 地形實體檢測工具
 */
function isSolidTile(x, y) {
  if (!customLevel) return false;
  const TILE_SIZE = CUSTOM_LEVEL_TILE_SIZE;
  const col = Math.floor(x / TILE_SIZE);
  const row = Math.floor(y / TILE_SIZE);

  // 邊界外視為實體牆壁，避免敵人走出地圖
  if (col < 0 || col >= customLevel.width || row < 0 || row >= customLevel.height) {
    return true;
  }

  // 檢查 Tile 圖層是否大於 0 (非空空白)
  return customLevel.layers.tiles[row * customLevel.width + col] > 0;
}

/**
 * 2. 敵人物理與牆壁碰撞處理器
 * 請在你的敵人迴圈中傳入 enemy 物件
 */
function handleEnemyPhysicsAndCollision(entity) {
  // 1. 水平移動與牆壁碰撞
  entity.x += entity.vx;
  
  if (customLevel) {
    const TILE_SIZE = CUSTOM_LEVEL_TILE_SIZE;
    const topY = entity.y + 4;
    const bottomY = entity.y + entity.h - 4;
    
    if (entity.vx > 0) { // 向右撞牆
      const rightX = entity.x + entity.w;
      if (isSolidTile(rightX, topY) || isSolidTile(rightX, bottomY)) {
        const col = Math.floor(rightX / TILE_SIZE);
        entity.x = col * TILE_SIZE - entity.w - 0.1;
        entity.vx = 0;
        if (entity.dir) entity.dir *= -1; // 自動折返
      }
    } else if (entity.vx < 0) { // 向左撞牆
      const leftX = entity.x;
      if (isSolidTile(leftX, topY) || isSolidTile(leftX, bottomY)) {
        const col = Math.floor(leftX / TILE_SIZE);
        entity.x = (col + 1) * TILE_SIZE + 0.1;
        entity.vx = 0;
        if (entity.dir) entity.dir *= -1; // 自動折返
      }
    }
  }

  // 2. 垂直重力與地面碰撞
  if (!entity.onGround) {
    entity.vy = (entity.vy || 0) + 0.5; // 重力加速度
    entity.y += entity.vy;
    
    if (customLevel) {
      const TILE_SIZE = CUSTOM_LEVEL_TILE_SIZE;
      const bottomY = entity.y + entity.h;
      const leftX = entity.x + 4;
      const rightX = entity.x + entity.w - 4;
      
      if (entity.vy > 0) { // 落地檢測
        if (isSolidTile(leftX, bottomY) || isSolidTile(rightX, bottomY)) {
          const row = Math.floor(bottomY / TILE_SIZE);
          entity.y = row * TILE_SIZE - entity.h;
          entity.vy = 0;
          entity.onGround = true;
        }
      }
    }
  }
}

function updateEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;

    // 掉落坑洞死亡檢測
    if (e.y > H + 100) {
      e.alive = false;
      killCount++;
      SFX.kill();
      continue;
    }

    // 1. 致命擊殺死亡飛出物理 (Death Launch Physics)
    if (e.deathLaunched) {
      e.x += e.kbVx;
      e.y += e.kbVy;
      e.kbVy += GRAVITY * 0.7;
      e.spinAngle += 0.35 * (e.kbVx >= 0 ? 1 : -1);
      e.deathTimer--;
      if (e.deathTimer <= 0 || e.y > H + 60) {
        e.alive = false;
        killCount++;
        SFX.kill();
        CameraShake.shake(6);
        // 死亡煙火粒子
        for (let i = 0; i < 18; i++) {
          VFXManager.particles.push({
            x: e.x + e.w / 2,
            y: e.y + e.h / 2,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.7) * 10,
            life: 20 + Math.random() * 10,
            maxLife: 30,
            size: 3 + Math.random() * 3,
            color: ['#ff4444', '#ffbb00', '#ffffff'][i % 3]
          });
        }
      }
      continue;
    }

    // 2. 敵人自身的打擊停頓 (Hitstop Freeze)
    if (e.hitstopTimer > 0) {
      e.hitstopTimer--;
      continue; // 停頓中暫停位移與動畫更新
    }

    // 3. 受擊硬直 (HitStun) 與擊飛物理 (Knockback & Air Juggle Physics)
    if (e.hitStun > 0) {
      e.hitStun--;
      if (e.flashTimer > 0) e.flashTimer--;
      if (e.hpBarTimer > 0) e.hpBarTimer--;
      e.isAttacking = false;
      e.attackPhase = 'none';

      // 方向性衝量位移
      e.vx = e.kbVx;
      e.vy = e.kbVy;
      e.kbVx *= 0.90;
      e.kbVy += GRAVITY * 0.65;
    }

    // 通用的物理更新邏輯 (包括受擊與非受擊)
    if (!e.deathLaunched && e.hitstopTimer <= 0) {
      if (e.hitStun <= 0) {
        e.vy += GRAVITY;
      }
      
      e.x += e.vx;
      e.y += e.vy;

      // 平台與地面碰撞 (由上往下的單向碰撞)
      let onGround = false;
      const curBottom = e.y + e.h;
      const prevBottom = curBottom - e.vy;

      if (customLevel) {
        const col = Math.floor((e.x + e.w / 2) / CUSTOM_LEVEL_TILE_SIZE);
        const row = Math.floor(curBottom / CUSTOM_LEVEL_TILE_SIZE);
        if (col >= 0 && col < customLevel.width && row >= 0 && row < customLevel.height) {
          if (customLevel.layers.tiles[row * customLevel.width + col] > 0) {
            const groundY = row * CUSTOM_LEVEL_TILE_SIZE;
            if (prevBottom <= groundY && curBottom >= groundY) {
              e.y = groundY - e.h;
              e.vy = 0;
              onGround = true;
            }
          }
        }
      } else {
        // 預設地板
        if (curBottom >= activeGroundY) {
          const cx = e.x + e.w / 2;
          if (!(cx > PIT_START && cx < PIT_END)) {
            if (prevBottom <= activeGroundY) {
              e.y = activeGroundY - e.h;
              e.vy = 0;
              onGround = true;
            }
          }
        }
        // 預設平台
        for (const plat of PLATFORMS) {
          if (e.x + e.w > plat.x && e.x < plat.x + plat.w) {
            if (prevBottom <= plat.y && curBottom >= plat.y) {
              e.y = plat.y - e.h;
              e.vy = 0;
              onGround = true;
            }
          }
        }
      }
      e.onGround = onGround;
    }

    if (e.hitStun > 0) {
      e.hitStun--;
      if (e.flashTimer > 0) e.flashTimer--;
      if (e.hpBarTimer > 0) e.hpBarTimer--;
      e.isAttacking = false;
      e.attackPhase = 'none';
      continue;
    }

    if (e.hpBarTimer > 0) e.hpBarTimer--;

    // 4. 敵人主動攻擊 AI 行為（冷卻、前搖預警、主動攻擊、收招）
    if (e.attackCooldown > 0) e.attackCooldown--;

    const distToPlayerX = (player.x + PLAYER_HIT_W / 2) - (e.x + e.w / 2);
    const distToPlayerY = Math.abs((player.y + PLAYER_HIT_H / 2) - (e.y + e.h / 2));
    const isPlayerNearby = Math.abs(distToPlayerX) < 160 && distToPlayerY < 75;

    if (e.type === 'slipper') {
      if (e.attackPhase === 'windup') {
        // 前搖時鎖定主角方向
        e.dir = distToPlayerX > 0 ? 1 : -1;
        e.attackTimer--;
        if (e.attackTimer <= 0) {
          e.attackPhase = 'strike';
          e.attackTimer = 18;
          e.isAttacking = true;
          e.vx = e.dir * 3.2;
        }
      } else if (e.attackPhase === 'strike') {
        // ❌原本是直接往前衝，沒有防撞牆：
        // e.x += e.vx;
        
        // 💡 改成這樣：加入與移動相同的碰撞檢測，衝刺撞牆就會立刻停下並收招！
        e.x += e.vx;
        if (customLevel) {
          const TILE_SIZE = CUSTOM_LEVEL_TILE_SIZE;
          const topY = e.y + 4;
          const bottomY = e.y + e.h - 4;
          
          if (e.vx > 0) { // 向右衝刺撞牆
            const rightX = e.x + e.w;
            if (isSolidTile(rightX, topY) || isSolidTile(rightX, bottomY)) {
              const col = Math.floor(rightX / TILE_SIZE);
              e.x = col * TILE_SIZE - e.w - 0.1;
              e.vx = 0;
              e.attackTimer = 1; // 撞牆直接結束衝刺進入收招
            }
          } else if (e.vx < 0) { // 向左衝刺撞牆
            const leftX = e.x;
            if (isSolidTile(leftX, topY) || isSolidTile(leftX, bottomY)) {
              const col = Math.floor(leftX / TILE_SIZE);
              e.x = (col + 1) * TILE_SIZE + 0.1;
              e.vx = 0;
              e.attackTimer = 1; // 撞牆直接結束衝刺進入收招
            }
          }
        }

        e.attackTimer--;
        if (e.attackTimer <= 0) {
          e.attackPhase = 'recover';
          e.attackTimer = 16;
          e.isAttacking = false;
          e.vx = 0;
        }

      } else if (e.attackPhase === 'recover') {
        e.attackTimer--;
        if (e.attackTimer <= 0) {
          e.attackPhase = 'none';
          e.attackCooldown = 70 + Math.floor(Math.random() * 30);
        }
      } else {
        e.isAttacking = false;
        
        // 追擊與防掉坑邏輯
        const chaseRange = 300;
        const distToPlayer = Math.sqrt(distToPlayerX * distToPlayerX + distToPlayerY * distToPlayerY);

        if (distToPlayer < chaseRange) {
          // 跟隨主角
          e.dir = distToPlayerX > 0 ? 1 : -1;
          if (isPlayerNearby && e.attackCooldown <= 0) {
            e.attackPhase = 'windup';
            e.attackTimer = ENEMY_WINDUP_FRAMES;
          }
        }

        // 偵測前方地面與坑洞
        const checkDist = 20;
        const frontX = e.dir > 0 ? e.x + e.w + checkDist : e.x - checkDist;
        const centerX = frontX;
        
        let hasGroundAhead = false;
        if (customLevel) {
          const col = Math.floor(frontX / CUSTOM_LEVEL_TILE_SIZE);
          const row = Math.floor((e.y + e.h + 5) / CUSTOM_LEVEL_TILE_SIZE);
          if (col >= 0 && col < customLevel.width && row >= 0 && row < customLevel.height) {
            hasGroundAhead = customLevel.layers.tiles[row * customLevel.width + col] > 0;
          }
        } else {
          if (e.y + e.h >= activeGroundY - 5) {
            if (!(centerX > PIT_START && centerX < PIT_END)) hasGroundAhead = true;
          }
          for (const plat of PLATFORMS) {
            if (centerX > plat.x && centerX < plat.x + plat.w && Math.abs(e.y + e.h - plat.y) < 10) {
              hasGroundAhead = true; break;
            }
          }
        }

        if (!hasGroundAhead && e.onGround) {
          e.dir *= -1; // 前方沒地，回頭
        }

        e.vx = e.speed * e.dir;
        // 💡 直接用碰撞函數取代原本單純的 e.x += e.vx
        handleEnemyPhysicsAndCollision(e);

        // 只有在非追擊狀態下才受 range 限制
        if (distToPlayer >= chaseRange) {
          if (e.x < e.range[0]) { e.x = e.range[0]; e.dir = 1; }
          if (e.x + e.w > e.range[1]) { e.x = e.range[1] - e.w; e.dir = -1; }
        }
      }
    }

    // 5. 檢測玩家 AttackBox 與 敵人 HurtBox 碰撞
    if (player.attackFrames > 0 && player.attackMove && !e.hasBeenHitThisAttack) {
      const move = player.attackMove;
      let atkX = player.facing === 1 ? player.x + PLAYER_HIT_W - 8 : player.x - ATTACK_W + 8;
      let atkY = player.y + 4;
      let atkW = ATTACK_W;
      let atkH = ATTACK_H;

      // 迴旋踢判定更廣更長
      if (move.id === 'kick') {
        atkW = ATTACK_W + 30;
        atkH = ATTACK_H + 8;
        if (player.facing === -1) atkX -= 30;
      } else if (move.id === 'head') {
        atkW = ATTACK_W + 10;
        atkH = ATTACK_H + 4;
      }

      const attackBox = new Hitbox(atkX, atkY, atkW, atkH);
      const hurtBox = new Hitbox(e.x, e.y, e.w, e.h);

      if (Hitbox.checkOverlap(attackBox, hurtBox)) {
        e.hasBeenHitThisAttack = true;
        e.isAttacking = false; // 玩家攻擊打斷敵方攻擊！
        e.attackPhase = 'none';
        player.attackHasHit = true;
        player.jumpCancelable = move.canJumpCancelOnHit;
        player.canComboCancel = true;

        // 計算重疊幾何中心點 (Contact Point) - 修正 Y 座標使其出現在角色上
        const contact = Hitbox.getContactPoint(attackBox, hurtBox);
        // 調整 contactY 使其出現在角色中心而非底部
        contact.y = e.y + e.h / 2 -150; // 修正為敵人中心點
        

        // 扣除敵人血量
        e.hp -= move.damage;
        e.hpBarTimer = 110;

        // 連擊統計
        player.comboCount = (player.comboCount || 0) + 1;
        player.comboResetTimer = 75;

        const isKill = e.hp <= 0;

        // 5.1 打擊停頓 (Hitstop / Frame Freeze)
        const hitstopFrames = isKill ? move.hitstop + 2 : move.hitstop;
        Hitstop.trigger(hitstopFrames);
        e.hitstopTimer = hitstopFrames;

        // 5.2 鏡頭震動 (Camera Shake)
        CameraShake.shake(isKill ? move.shake + 2.5 : move.shake);

        // 5.3 受擊僵直與方向性衝量向量 (Knockback Vector)
        e.flashTimer = hitstopFrames + 5;
        if (isKill) {
          e.deathLaunched = true;
          e.deathTimer = 36;
          // ★ 迴旋踢擊殺時，擊飛超遠！
          const killMult = move.id === 'kick' ? 2.2 : 1.8;
          e.kbVx = player.facing * (move.kbX * killMult + 3.0);
          e.kbVy = Math.min(-8.5, move.kbY - 2.5);
        } else {
          e.hitStun = move.hitStun;
          // ★ 在踢的時候，敵人會飛比較遠！
          e.kbVx = player.facing * move.kbX;
          e.kbVy = move.kbY;
        }

        // 5.4 音效播放
        if (SFX[move.sfx]) SFX[move.sfx]();

        // 5.5 觸發打擊特效 Hook
        VFXManager.emitHit({
          contactX: contact.x,
          contactY: contact.y,
          attacker: player,
          defender: e,
          move: move,
          isHeavy: move.id === 'kick',
          isKill: isKill,
          facing: player.facing,
          comboCount: player.comboCount
        });
      }
    }

    // 6. 核心機制：只有在敵人主動攻擊時 (e.isAttacking === true)，主角才會受傷！
    // 單純碰到敵人不會受傷！
    if (!e.deathLaunched && e.hitStun <= 0 && e.isAttacking) {
      if (aabb(player.x, player.y, PLAYER_HIT_W, PLAYER_HIT_H, e.x, e.y, e.w, e.h)) {
        hurtPlayer();
        e.isAttacking = false; // 命中後單次結算傷害，避免多重扣血
      }
    }
  }
}

function updateBoss() {
  const b = boss;
  if (!b) return;

  // 死亡狀態獨立處理在最前面，確保每一幀都會被執行到，不會被其他邏輯擋住
  if (b.phase === 'dead') {
    b.timer--;
    if (b.timer <= 0) {
      state = 'WIN';
      winTick = 0;
      playBirthday();
      player.hearts = 5;
    }
    return;
  }

  if (b.hitCooldown > 0) b.hitCooldown--;

  // Boss physics - gravity and ground collision
  b.vy += GRAVITY;
  b.y += b.vy;

  // Ground collision
  b.onGround = false;
  if (b.vy >= 0) {
    const bottom = b.y + b.h;
    const prevBottom = bottom - b.vy;
    if (customLevel) {
      const col = Math.floor((b.x + b.w / 2) / CUSTOM_LEVEL_TILE_SIZE);
      const row = Math.floor(bottom / CUSTOM_LEVEL_TILE_SIZE);
      if (col >= 0 && col < customLevel.width && row >= 0 && row < customLevel.height) {
        if (customLevel.layers.tiles[row * customLevel.width + col] > 0) {
          const tileTop = row * CUSTOM_LEVEL_TILE_SIZE;
          if (prevBottom <= tileTop && bottom >= tileTop) {
            b.y = tileTop - b.h;
            b.vy = 0;
            b.onGround = true;
          }
        }
      }
    } else {
      if (bottom >= GROUND_Y && prevBottom <= GROUND_Y) {
        b.y = GROUND_Y - b.h;
        b.vy = 0;
        b.onGround = true;
      }
      for (const plat of PLATFORMS) {
        if (b.x + b.w > plat.x && b.x < plat.x + plat.w) {
          if (prevBottom <= plat.y && bottom >= plat.y) {
            b.y = plat.y - b.h;
            b.vy = 0;
            b.onGround = true;
          }
        }
      }
    }
  }

  // Keep boss within bounds
  const levelWidth = customLevel ? customLevel.width * CUSTOM_LEVEL_TILE_SIZE : LEVEL_WIDTH;
  b.x = Math.max(50, Math.min(levelWidth - b.w - 50, b.x));

  // Boss 動畫更新
  if (b.anim !== b.prevAnim) {
    b.animTick = 0;
    b.animFrame = 0;
    b.prevAnim = b.anim;
  }
  b.animTick++;
  const bossAnimDef = { idle: 16, move: 8, attack: 12, spray: 10 };
  const currentAnimDur = bossAnimDef[b.anim] || 16;
  if (b.animTick >= currentAnimDur) {
    b.animTick = 0;
    const frameCount = BOSS_ACTION_FRAME_COUNTS[b.anim] || 1;
    b.animFrame = (b.animFrame + 1) % frameCount;
  }

  // 攻擊玩家 hitbox
  if (b.phase === 'action' && b.nextPattern === 'attack' && b.actionTick > 8 && b.actionTick < 20) {
    if (aabb(player.x, player.y, PLAYER_HIT_W, PLAYER_HIT_H, b.x, b.y, b.w, b.h)) {
      hurtPlayer();
    }
  }

  // Boss 被咬/打擊判定
  if (player.attackFrames > 0 && player.attackMove && b.hitCooldown <= 0) {
    const move = player.attackMove;
    let atkX = player.facing === 1 ? player.x + PLAYER_HIT_W - 8 : player.x - ATTACK_W + 8;
    let atkY = player.y + 4;
    let atkW = ATTACK_W;
    let atkH = ATTACK_H;
    if (move.id === 'kick') { atkW = ATTACK_W + 30; atkH = ATTACK_H + 10; if (player.facing === -1) atkX -= 30; }

    const attackBox = new Hitbox(atkX, atkY, atkW, atkH);
    const hurtBox = new Hitbox(b.x, b.y, b.w, b.h);

    if (Hitbox.checkOverlap(attackBox, hurtBox)) {
      player.attackHasHit = true;
      player.jumpCancelable = true;
      player.canComboCancel = true;
      player.comboCount = (player.comboCount || 0) + 1;
      player.comboResetTimer = 75;

      b.hp -= (move.id === 'kick' ? 2 : 1);
      b.hitCooldown = 32;
      b.flashTimer = 8;

      const contact = Hitbox.getContactPoint(attackBox, hurtBox);
      contact.y = b.y + b.h / 2 -120;
      const isKill = b.hp <= 0;

      Hitstop.trigger(isKill ? 12 : move.hitstop + 1);
      CameraShake.shake(isKill ? 8.5 : move.shake + 1.5);
      SFX.bosshit();

      VFXManager.emitHit({
        contactX: contact.x,
        contactY: contact.y,
        attacker: player,
        defender: b,
        move: move,
        isHeavy: move.id === 'kick',
        isKill: isKill,
        facing: player.facing,
        comboCount: player.comboCount
      });

      if (b.phase === 'action' && Math.random() > b.attackResistance) {
        // 不打斷 Boss
      } else if (b.phase !== 'idle') {
        b.phase = 'recover';
        b.timer = 20;
      }

      if (b.hp <= 0) {
        b.phase = 'dead';
        b.timer = 90;
        projectiles = [];
        shockwaves = [];
        for (const e of b.summonedEnemies) e.alive = false;
        return; // 立刻結束，避免本幀繼續跑下方 idle/telegraph/action 狀態機
      }
    }
  }

  b.timer--;

  // 計算 Boss 與玩家中心點的實際距離
  const distToPlayer = Math.abs((player.x + PLAYER_HIT_W / 2) - (b.x + b.w / 2));

  if (b.phase === 'idle') {
    b.anim = 'idle';
    const moveDir = player.x - b.x;
// 💡 1. 這裡不要直接改 b.x，而是設定 b.vx 速度！
    if (Math.abs(moveDir) > 50) {
      b.vx = Math.sign(moveDir) * 0.5;
    } else {
      b.vx = 0; // 靠近時速度歸零
    }

    handleEnemyPhysicsAndCollision(b);

    if (b.timer <= 0) {
      b.phase = 'telegraph';
      b.timer = 40;

      const SPRAY_RANGE = 450; // 🎯 發射噴彈的最大允許距離 (像素)

      if (distToPlayer <= SPRAY_RANGE) {
        // 靠近時：隨機在 attack 與 spray 中選擇 (避免連續重複同一招)
        const patterns = ['attack', 'spray'];
        const avail = patterns.filter(p => p !== b.lastPattern);
        b.nextPattern = avail[Math.floor(Math.random() * avail.length)];
      } else {
        // 太遠時：強制改成近戰/靠近招式，絕不發射子彈
        b.nextPattern = 'attack';
      }
      b.lastPattern = b.nextPattern;
    }
  } else if (b.phase === 'telegraph') {
    b.anim = 'idle';
    const moveDir = player.x - b.x;
    if (Math.abs(moveDir) > 30) {
      b.x += Math.sign(moveDir) * 0.3;
    }

    // 💡 招式前搖蓄力特效 (Telegraph Visual Effects)
    b.shakeOffsetX = (Math.random() - 0.5) * 3;                     // 1. 本體微幅抖動
    b.flashWhite = Math.floor(b.timer / 4) % 2 === 0;               // 2. 白光頻率閃爍

// 3. 噴彈招式額外產生紅/黃色蓄力縮小氣浪環
    if (b.nextPattern === 'spray' && b.timer % 8 === 0) {
      // 計算 Boss 在畫面上的視覺中心 Y 軸 (考慮 150px 的繪製圖高偏移)
      const bossVisualCenterY = b.y - (150 - b.h) -60; // 💡 +60 剛好會對準 Boss 的胸口/頭部位置

      VFXManager.rings.push({
        x: b.x + b.w / 2,         // Boss 水平中心
        y: bossVisualCenterY,     // 精準對齊視覺胸口
        radius: 50,
        maxRadius: 8,
        alpha: 0.9,
        color: '#ff3366',
        lineWidth: 3
      });
    }

    if (b.timer <= 0) {
      b.shakeOffsetX = 0; // 清除抖動
      b.flashWhite = false; // 關閉白光
      b.phase = 'action';
      b.timer = b.nextPattern === 'spray' ? 90 : 60;
      b.actionTick = 0;
      b.sprayCount = 0;
      b.anim = b.nextPattern === 'attack' ? 'attack' : 'spray';
    }
  } else if (b.phase === 'action') {
    b.actionTick++;
    if (b.nextPattern === 'spray') {
      if (b.actionTick % 50 === 1 && b.sprayCount < 3) {
        b.sprayCount++;
        const dir = player.x < b.x ? -1 : 1;
        projectiles.push({
          x: b.x + b.w / 2,
          y: b.y + b.h - 40,
          vx: dir * 5.5,
          w: 20,
          h: 20,
          alive: true,
          isSpray: true
        });
      }
} else if (b.nextPattern === 'attack') {
      const moveDir = player.x - b.x;
      
      // 💡 1. 這裡改成設定速度 b.vx
      if (Math.abs(moveDir) > 40) {
        b.vx = Math.sign(moveDir) * 1.5;
      } else {
        b.vx = 0;
      }
      
      // 💡 2. 加上碰撞檢測，這樣 Boss 準備用這招靠近時，撞到牆壁就會停下來！
      handleEnemyPhysicsAndCollision(b);
    }
    if (b.timer <= 0) { b.phase = 'recover'; b.timer = 50; b.anim = 'idle'; }
  } else if (b.phase === 'recover') {
    b.anim = 'idle';
    if (b.timer <= 0) { b.phase = 'idle'; b.timer = 30 + Math.floor(Math.random() * 20); }
  }

  b.facing = player.x < b.x + b.w / 2 ? -1 : 1;

  for (const p of projectiles) {
    p.x += p.vx;
    const levelWidth = customLevel ? customLevel.width * CUSTOM_LEVEL_TILE_SIZE : LEVEL_WIDTH;
    if (p.x < -50 || p.x > levelWidth + 50) p.alive = false;

    const playerIsJumping = !player.onGround || player.vy < -1;
    if (p.isSpray && playerIsJumping) {
      // 玩家跳起來閃過
    } else if (aabb(player.x, player.y, PLAYER_HIT_W, PLAYER_HIT_H, p.x, p.y, p.w, p.h)) {
      p.alive = false; hurtPlayer();
    }
  }
  projectiles = projectiles.filter(p => p.alive);

  updateEnemies();
}

function updateLevel() {
  updatePlayer();
  updateEnemies();
  if (boss) updateBoss();
  // 鏡頭跟隨
  const targetCam = player.x - W / 2 + PLAYER_HIT_W / 2;
  cameraX = Math.max(0, Math.min(Math.max(0, activeLevelWidth - W), targetCam));
  const levelHeight = customLevel ? customLevel.height * CUSTOM_LEVEL_TILE_SIZE : H;
  const targetCameraY = customLevel ? player.y - H * 0.5 : 0;
  cameraY = Math.max(0, Math.min(Math.max(0, levelHeight - H), targetCameraY));
  // 終點 - only for default level
  if (!customLevel && player.x > activeGateX) {
    state = 'BOSS_INTRO';
    bossIntroTimer = 0;
    boss = makeBoss();
    player.x = 60;
    player.y = GROUND_Y - PLAYER_HIT_H;
    player.vx = 0; player.vy = 0;
    cameraX = 0; cameraY = 0;
  }
}

function updateBossIntro() {
  bossIntroTimer++;
  if (bossIntroTimer === 70) boss.revealed = true;
  if (bossIntroTimer > 160 || justPressed['Space']) { state = 'BOSS'; }
}

// ═══════════════════════════════════════════════════════════
// 10. 渲染
// ═══════════════════════════════════════════════════════════

function renderBackground() {
  const offset = -Math.floor(cameraX * 0.18) % KENNEY_BACKGROUND_TILE_SIZE;
  for (let y = 0; y < H; y += KENNEY_BACKGROUND_TILE_SIZE) {
    const tileIndex = y < 240 ? 0 : y < 360 ? 15 : 30;
    for (let x = offset - KENNEY_BACKGROUND_TILE_SIZE; x < W; x += KENNEY_BACKGROUND_TILE_SIZE) {
      drawKenneyBackgroundTile(tileIndex, x, y);
    }
  }
}

function renderCustomMap() {
  const mapX = -cameraX;
  const mapY = -cameraY;
  const startCol = Math.max(0, Math.floor(cameraX / CUSTOM_LEVEL_TILE_SIZE) - 1);
  const endCol = Math.min(customLevel.width, Math.ceil((cameraX + W) / CUSTOM_LEVEL_TILE_SIZE) + 1);
  for (let row = 0; row < customLevel.height; row++) {
    for (let col = startCol; col < endCol; col++) {
      const i = row * customLevel.width + col;
      const x = mapX + col * CUSTOM_LEVEL_TILE_SIZE;
      const y = mapY + row * CUSTOM_LEVEL_TILE_SIZE;
      drawCustomTile('kenney_backgrounds', customLevel.layers.backgrounds[i], x, y);
      drawCustomTile('kenney_tiles', customLevel.layers.tiles[i], x, y);
      // Don't render static character tiles - they're used only for spawning
      // Boss rendering is handled separately in renderBossCreature
    }
  }
}

function renderPlatforms() {
  for (const p of PLATFORMS) {
    const sx = p.x - cameraX;
    if (sx > W || sx + p.w < 0) continue;
    if (p.sprite === 'floor') {
      for (let tx = 0; tx < p.w; tx += KENNEY_TILE_SIZE) {
        drawKenneyTile(assets['kenney_tiles'], 0, sx + tx, p.y);
        for (let ty = KENNEY_TILE_SIZE; ty < p.h; ty += KENNEY_TILE_SIZE) {
          drawKenneyTile(assets['kenney_tiles'], 20, sx + tx, p.y + ty);
        }
      }
    } else if (p.sprite === 'kenney') {
      for (let tx = 0; tx < p.w; tx += KENNEY_TILE_SIZE) {
        drawKenneyTile(assets['kenney_tiles'], 21, sx + tx, p.y);
      }
    } else {
      drawKenneyTile(assets['kenney_tiles'], 0, sx, p.y);
    }
  }
}

function renderDecor() {
  for (const d of DECOR_DEFS) {
    const sx = d.x - cameraX;
    if (sx > W || sx + d.w < 0) continue;
    if (d.type === 'tree') {
      drawKenneyTile(assets['kenney_tiles'], 153, sx + d.w * 0.18, d.y, d.w / 18);
      drawKenneyTile(assets['kenney_tiles'], 154, sx + d.w * 0.45, d.y, d.w / 18);
      drawKenneyTile(assets['kenney_tiles'], 155, sx + d.w * 0.72, d.y, d.w / 18);
      drawKenneyTile(assets['kenney_tiles'], 173, sx + d.w * 0.28, d.y + d.h * 0.35, d.w / 18);
      drawKenneyTile(assets['kenney_tiles'], 174, sx + d.w * 0.55, d.y + d.h * 0.35, d.w / 18);
    } else if (d.type === 'gate') {
      drawKenneyTile(assets['kenney_tiles'], 21, sx, d.y, d.w / 18);
      drawKenneyTile(assets['kenney_tiles'], 41, sx, d.y + d.h * 0.35, d.w / 18);
    }
  }
}

function renderPit() {
  const sx = PIT_START - cameraX;
  if (sx < W && sx + (PIT_END - PIT_START) > 0) {
    const pw = PIT_END - PIT_START;
    for (let x = 0; x < pw; x += KENNEY_TILE_SIZE) {
      drawKenneyTile(assets['kenney_tiles'], 53, sx + x, GROUND_Y);
      drawKenneyTile(assets['kenney_tiles'], 73, sx + x, GROUND_Y + KENNEY_TILE_SIZE);
    }
  }
}

function renderEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    const sx = e.x - cameraX;
    const sy = e.y - cameraY;
    if (sx > W + 80 || sx + e.w < -80) continue;
    const flipX = e.dir ? e.dir < 0 : false;

    // 取得敵人素材的原始比例
    const charSheet = assets['kenney_characters'];
    const charW = KENNEY_CHARACTER_TILE_SIZE;
    const charH = KENNEY_CHARACTER_TILE_SIZE;
    const targetH = e.h;
    const targetW = targetH * (charW / charH); // 保持 1:1 或原始比例

    ctx.save();
    // 死亡飛出旋轉 (Death Launch)
    if (e.deathLaunched) {
      ctx.translate(sx + e.w / 2, sy + e.h / 2);
      ctx.rotate(e.spinAngle);
      drawKenneyCharacterTile(0, -targetW / 2, -targetH / 2, targetW, targetH, false);
    } else {
      // 受擊微抖動 (Hitstop Vibration)
      let shakeX = 0, shakeY = 0;
      if (e.hitstopTimer > 0) {
        shakeX = (Math.random() - 0.5) * 5;
        shakeY = (Math.random() - 0.5) * 5;
      }
      // 前搖蓄力抖動
      if (e.attackPhase === 'windup') {
        shakeX = (Math.random() - 0.5) * 3;
        shakeY = (Math.random() - 0.5) * 2;
        ctx.filter = 'brightness(1.5) saturate(1.8)';
      }
      // 受擊閃爍 (Hit Flash Effect)
      if (e.flashTimer > 0) {
        ctx.filter = 'brightness(2.8) saturate(0.2)';
      }
      drawKenneyCharacterTile(0, sx + shakeX + (e.w - targetW) / 2, sy + shakeY, targetW, targetH, flipX);
    }
    ctx.restore();

    // 敵人攻擊前搖危險警示 (Telegraph Warning)
    if (e.attackPhase === 'windup' && !e.deathLaunched) {
      ctx.save();
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚠️', sx + e.w / 2, e.y - cameraY - 14);
      ctx.restore();
    }

    // 敵人攻擊揮砍特效 (Slash VFX)
    if (e.isAttacking && !e.deathLaunched && e.attackPhase === 'strike') {
      ctx.save();
      const slashX = sx + e.w / 2 + e.dir * 30;
      const slashY = sy + e.h / 2;
      const progress = e.attackTimer / 18; // strike 期間 18 frame
      ctx.translate(slashX, slashY);
      if (e.dir < 0) ctx.scale(-1, 1);
      ctx.beginPath();
      ctx.arc(0, 0, 45, -Math.PI / 3, Math.PI / 3);
      ctx.strokeStyle = `rgba(255, 255, 255, ${progress})`;
      ctx.lineWidth = 4;
      ctx.stroke();
      // 內層紅光
      ctx.beginPath();
      ctx.arc(0, 0, 40, -Math.PI / 3, Math.PI / 3);
      ctx.strokeStyle = `rgba(255, 50, 50, ${progress * 0.7})`;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    // 敵人頭頂血條 (受擊時顯示)
    if (e.hpBarTimer > 0 && e.maxHp > 1 && !e.deathLaunched) {
      const barW = 44, barH = 5;
      const barX = sx + (e.w - barW) / 2;
      const barY = e.y - cameraY - 12;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
      const fillW = Math.max(0, (e.hp / e.maxHp) * barW);
      ctx.fillStyle = e.hp > 1 ? '#4cd964' : '#ff3b30';
      ctx.fillRect(barX, barY, fillW, barH);
    }
  }
}

function renderPlayer() {
  const p = player;
  const px = p.x - cameraX - (PLAYER_DRAW_W - PLAYER_HIT_W) / 2;
  const py = p.y - cameraY - (PLAYER_DRAW_H - PLAYER_HIT_H);

  // 無敵閃爍（每 6 frame 閃一次）
  if (p.hurtFrames > 0 && Math.floor(p.hurtFrames / 6) % 2 === 0) {
    ctx.globalAlpha = 0.35;
  }

  const animDef = SOJU_FRAMES[p.anim] || SOJU_FRAMES.idle;
  const frameIndex = p.animFrame % animDef.frames.length;
  const frame = animDef.frames[frameIndex];
  drawSojuFrame(p.anim, frameIndex, px, py, PLAYER_DRAW_W, PLAYER_DRAW_H, p.facing < 0);

  ctx.globalAlpha = 1;
}

function renderBossCreature() {
  const b = boss;
  if (!b) return;
  const bw = 120, bh = 150;
  const bx = b.x - (bw - b.w) / 2 - cameraX;
  const by = b.y - (bh - b.h) - cameraY;

  // telegraph 抖動 (若 updateBoss 有算 b.shakeOffsetX 則優先使用，否則用原本的弦波抖動)
  let shake = 0;
  if (b.phase === 'telegraph') {
    shake = b.shakeOffsetX !== undefined ? b.shakeOffsetX : Math.sin(bossIntroTimer * 0.8 + Date.now() * 0.02) * 3;
  }
  // dead 下沉
  const deadSink = b.phase === 'dead' ? Math.min((90 - b.timer) * 0.5, 30) : 0;

  ctx.save();
  
  // 💡 1. 處理閃光效果 (兼顧受傷閃光 b.flashTimer 與 Telegraph 前搖閃爍 b.flashWhite)
  if (b.flashTimer > 0) {
    b.flashTimer--;
    ctx.filter = 'brightness(2.6)';
  } else if (b.flashWhite) {
    // Telegraph 蓄力閃爍白光 (讓彩度歸零、亮度大幅提升，呈現純白蓄力感)
    ctx.filter = 'brightness(3) contrast(0)';
  }

  // 使用實際的 Boss sprite frames
  const bossImg = bossFrameImage(b.anim, b.animFrame);
  if (bossImg) {
    const drawW = bw;
    const drawH = bh;
    const drawX = b.facing < 0 ? bx + bw - drawW : bx;
    drawImg(bossImg, drawX + shake, by + deadSink, drawW, drawH, b.facing < 0);
  } else {
    // Fallback to Kenney character if boss sprites not loaded
    drawKenneyCharacterTile(8, bx + shake, by + deadSink, bw, bh, b.facing < 0);
  }
  ctx.restore();

  // Boss 彈幕
  for (const p of projectiles) {
    if (p.isSpray) {
      // 繪製洗耳液體彈幕
      ctx.fillStyle = '#ffdd44';
      ctx.beginPath();
      ctx.arc(p.x - cameraX, p.y - cameraY, p.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ff9900';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else {
      drawKenneyCharacterTile(18, p.x - 8 - cameraX, p.y - 8 - cameraY, 16, 16);
    }
  }
}

function renderHUD() {
  const p = player;
  // 愛心
  for (let i = 0; i < 5; i++) {
    const hImg = i < p.hearts ? assets['heart_full'] : assets['heart_empty'];
    drawImg(hImg, 14 + i * 32, 12, 24, 24);
  }
  // 擊倒數（關卡時）
  if (state === 'LEVEL') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(12, 42, 80, 20);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px Noto Sans TC, sans-serif';
    ctx.fillText(`擊倒: ${killCount}`, 18, 56);
  }
  // 連擊數顯示 (Juicy Combo Counter)
  if (p && p.comboCount >= 2) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '900 24px "Arial Black", sans-serif';
    ctx.fillStyle = '#ffcc00';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4;
    ctx.shadowColor = 'rgba(255, 120, 0, 0.9)';
    ctx.shadowBlur = 12;
    const txt = `${p.comboCount} HITS!`;
    ctx.strokeText(txt, W / 2, 64);
    ctx.fillText(txt, W / 2, 64);
    ctx.restore();
  }
  // 目標提示
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W - 185, 10, 180, 22);
  ctx.fillStyle = '#ffe566';
  ctx.font = 'bold 13px Noto Sans TC, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('打倒魔王，救出主人！', W - 14, 25);
  ctx.textAlign = 'left';
}

function renderBossHUD() {
  if (!boss) return;
  const bw = 240, bh = 22;
  const bx = (W - bw) / 2;
  const by = 14;
  // 標題
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(bx - 4, by - 18, bw + 8, 48);
  ctx.fillStyle = '#e0eeff';
  ctx.font = 'bold 12px Noto Sans TC, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('巨大洗耳液魔王', W / 2, by - 4);
  ctx.textAlign = 'left';
  // 血量槽背景
  ctx.fillStyle = '#3a1a2a';
  ctx.fillRect(bx, by, bw, bh);
  // 血量
  ctx.fillStyle = '#e03060';
  const ratio = Math.max(0, boss.hp / boss.maxHp);
  ctx.fillRect(bx, by, bw * ratio, bh);
  // 分格 - 每 3 HP 一格
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  const segments = Math.ceil(boss.maxHp / 3);
  for (let i = 1; i < segments; i++) {
    const ix = bx + bw * i / segments;
    ctx.beginPath(); ctx.moveTo(ix, by); ctx.lineTo(ix, by + bh); ctx.stroke();
  }
  ctx.strokeRect(bx, by, bw, bh);
}

function renderStoryScene(scene) {
  const sceneImg = assets[`scene0${scene + 1}`];
  if (sceneImg) {
    ctx.drawImage(sceneImg, 0, 0, W, H);
  } else {
    // fallback
    ctx.fillStyle = '#1a1220';
    ctx.fillRect(0, 0, W, H);
  }
}

function renderTitle() {
  titleTick++;
  ctx.fillStyle = '#0e0a1a';
  ctx.fillRect(0, 0, W, H);

  // 星星背景
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 60; i++) {
    const sx = ((i * 137 + titleTick * 0.1) % W);
    const sy = ((i * 73) % H);
    ctx.fillRect(sx, sy, 1, 1);
  }

  // Soju 大圖
  const sp = SOJU_FRAMES.idle;
  const t = Math.floor(titleTick / sp.dur) % sp.frames.length;
  const f = sp.frames[t];
  drawSojuFrame('idle', t, W / 2 - 80, 120, 160, 140);

  // 標題文字
  ctx.textAlign = 'center';
  ctx.font = 'bold 52px Noto Sans TC, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(180,120,255,0.8)'; ctx.shadowBlur = 20;
  ctx.fillText('Soju 大冒險', W / 2, 310);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 18px Noto Sans TC, sans-serif';
  ctx.fillStyle = '#a08080';
  ctx.fillText("Soju's Adventure", W / 2, 340);

  // 閃爍提示
  if (Math.floor(titleTick / 30) % 2 === 0) {
    ctx.font = 'bold 18px Noto Sans TC, sans-serif';
    ctx.fillStyle = '#ffe566';
    ctx.fillText('按空白鍵開始遊戲', W / 2, 420);
  }
  ctx.textAlign = 'left';
}

function renderStory() {
  storyTick++;
  renderStoryScene(storyScene);
  // 字幕
  const captions = [
    '妍霏跟 SOJU 過得好開心！',
    '突然間，出現了恐怖的黃色怪物！',
    '什麼！怪物把妍霏給關起來了！',
    '天啊！不要～快放開主人！',
    'Soju：我一定會去救你的，主人！（按空白鍵開始冒險）',
  ];
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, H - 90, W, 90);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 19px Noto Sans TC, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(captions[storyScene], W / 2, H - 52);
  ctx.font = '14px Noto Sans TC, sans-serif';
  ctx.fillStyle = Math.floor(storyTick / 25) % 2 === 0 ? '#ffe566' : 'rgba(255,229,102,0.4)';
  ctx.fillText('▶ 按空白鍵繼續', W / 2, H - 24);
  ctx.textAlign = 'left';
}

function renderLevel() {
  if (customLevel) {
    renderCustomMap();
  } else {
    renderBackground();
    renderPlatforms();
    renderDecor();
    renderPit();
  }
  renderEnemies();
  renderBossCreature();
  renderPlayer();
  VFXManager.render(ctx, cameraX);
  renderBossHUD();
  renderHUD();
}

function renderBossIntro() {
  // 暗紅背景
  ctx.fillStyle = '#1a0810';
  ctx.fillRect(0, 0, W, H);
  const b = boss;
  const bw = 160, bh = 210;
  drawKenneyCharacterTile(8, W / 2 - bw / 2, H / 2 - bh / 2 - 20, bw, bh);

  // 玩家
  const sp = SOJU_FRAMES.idle;
  const f = sp.frames[Math.floor(bossIntroTimer / sp.dur) % sp.frames.length];
  drawSojuFrame('idle', Math.floor(bossIntroTimer / sp.dur) % sp.frames.length, 60, GROUND_Y - PLAYER_DRAW_H, PLAYER_DRAW_W, PLAYER_DRAW_H, false);

  // 字幕
  const caption = b.revealed
    ? '？？？：嘿嘿...原來是我，洗耳液魔王！'
    : '一團神祕的斗篷身影擋住了去路...';
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, H - 90, W, 90);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 19px Noto Sans TC, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(caption, W / 2, H - 52);
  ctx.font = '14px Noto Sans TC, sans-serif';
  ctx.fillStyle = Math.floor(bossIntroTimer / 25) % 2 === 0 ? '#ffe566' : 'rgba(255,229,102,0.4)';
  ctx.fillText('▶ 按空白鍵跳過', W / 2, H - 24);
  ctx.textAlign = 'left';
}

function renderBossRoom() {
  if (customLevel) {
    renderCustomMap();
  } else {
    renderBackground();
    for (let x = 0; x < W; x += KENNEY_TILE_SIZE) {
      drawKenneyTile(assets['kenney_tiles'], 0, x, GROUND_Y);
      for (let y = GROUND_Y + KENNEY_TILE_SIZE; y < H; y += KENNEY_TILE_SIZE) {
        drawKenneyTile(assets['kenney_tiles'], 20, x, y);
      }
    }
  }
  renderEnemies(); // Render dynamic enemies, not static tiles
  renderBossCreature();
  renderPlayer();
  VFXManager.render(ctx, 0);
  renderBossHUD();
  renderHUD();
}

function renderWin() {
  winTick++;
  const winImg = assets['scene06'];
  if (winImg) {
    ctx.drawImage(winImg, 0, 0, W, H);
  } else {
    ctx.fillStyle = '#0a0a20';
    ctx.fillRect(0, 0, W, H);
  }

  // 愛心裝飾
  const hearts = ['💕', '💖', '✨', '🎉', '🐾'];
  for (let i = 0; i < hearts.length; i++) {
    const angle = (winTick * 0.03 + i * (Math.PI * 2 / hearts.length));
    const rx = W/2 + 140 * Math.cos(angle);
    const ry = H/2 - 60 + 50 * Math.sin(angle);
    ctx.font = '28px serif';
    ctx.textAlign = 'center';
    ctx.fillText(hearts[i], rx, ry);
  }

  ctx.textAlign = 'center';
  ctx.font = 'bold 38px Noto Sans TC, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(255,200,100,0.9)'; ctx.shadowBlur = 22;
  ctx.fillText('母女團聚啦！', W / 2, 100);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 26px Noto Sans TC, sans-serif';
  ctx.fillStyle = '#ffe566';
  ctx.shadowColor = 'rgba(255,200,100,0.7)'; ctx.shadowBlur = 14;
  ctx.fillText('妍霏生日快樂🎂', W / 2, 148);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
}

function renderLose() {
  ctx.fillStyle = 'rgba(10,5,20,0.9)';
  ctx.fillRect(0, 0, W, H);

  // Soju 失落表情
  const f = SOJU_FRAMES.hurt.frames[0];
  drawSojuFrame('hurt', 0, W/2 - 55, H/2 - 160, 110, 96);

  ctx.textAlign = 'center';
  ctx.font = 'bold 40px Noto Sans TC, sans-serif';
  ctx.fillStyle = '#ff5577';
  ctx.shadowColor = 'rgba(255,80,100,0.6)'; ctx.shadowBlur = 16;
  ctx.fillText('Soju 不爽了！', W / 2, H / 2 - 40);
  ctx.shadowBlur = 0;
  ctx.font = '20px Noto Sans TC, sans-serif';
  ctx.fillStyle = '#aaa';
  ctx.fillText('（下次一定能救到主人的...）', W / 2, H / 2 - 5);
  ctx.textAlign = 'left';
}

// ═══════════════════════════════════════════════════════════
// 11. 主迴圈
// ═══════════════════════════════════════════════════════════
let lastTime = 0;
let accum = 0;
const STEP = 1000 / 60;

function update() {
  // 打擊停頓 (Hitstop Freeze)：處於停頓時暫停世界位移與動畫更新，但震動與輸入快取保持運作
  if (Hitstop.update()) {
    CameraShake.update();
    VFXManager.update();
    InputBuffer.cleanup();
    clearJustPressed();
    return;
  }

  CameraShake.update();
  VFXManager.update();
  InputBuffer.cleanup();

  if (state === 'TITLE') {
    if (justPressed['Space']) { state = 'STORY'; storyScene = 0; storyTick = 0; }
  } else if (state === 'STORY') {
    if (justPressed['Space']) {
      storyScene++;
      storyTick = 0;
      if (storyScene >= 5) { state = 'LEVEL'; resetLevel(); }
    }
  } else if (state === 'LEVEL') {
    updateLevel();
  } else if (state === 'BOSS_INTRO') {
    updateBossIntro();
  } else if (state === 'BOSS') {
    updatePlayer();
    updateBoss();
  } else if (state === 'WIN') {
    // WIN state - no updates, player cannot escape
    return;
  }
  clearJustPressed();
}

function render() {
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  // 鏡頭震動位移偏移 (Camera Shake)
  if (state === 'LEVEL' || state === 'BOSS') {
    ctx.translate(Math.round(CameraShake.offsetX), Math.round(CameraShake.offsetY));
  }
  if (state === 'TITLE') renderTitle();
  else if (state === 'STORY') renderStory();
  else if (state === 'LEVEL') renderLevel();
  else if (state === 'BOSS_INTRO') renderBossIntro();
  else if (state === 'BOSS') renderBossRoom();
  else if (state === 'WIN') renderWin();
  else if (state === 'LOSE') renderLose();
  ctx.restore();
}

function gameLoop(ts) {
  if (state === 'LOADING') return;
  accum += ts - lastTime;
  lastTime = ts;
  while (accum >= STEP) { update(); accum -= STEP; }
  render();
  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════════════════════════
// 12. 啟動
// ═══════════════════════════════════════════════════════════
document.getElementById('restartBtn').addEventListener('click', () => {
  if (state === 'WIN') return; // Prevent restart in WIN state
  resetLevel();
  state = 'LEVEL';
  document.getElementById('restartBtn').style.display = 'none';
  ensureAudio();
});

loadAllAssets().then(() => {
  loadCustomLevel();
  document.getElementById('loadingScreen').style.display = 'none';
  state = 'TITLE';
  lastTime = performance.now();
  requestAnimationFrame((ts) => { lastTime = ts; requestAnimationFrame(gameLoop); });
});
</script>
