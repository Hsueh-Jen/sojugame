<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="out"></pre>
<script>
async function checkAll() {
  const list = ['idle', 'run', 'jump', 'bite'];
  const res = {};
  for (const name of list) {
    const img = new Image();
    img.src = `imgs/${name}.jpeg`;
    await new Promise(r => img.onload = r);
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const px = ctx.getImageData(0,0,img.width,img.height).data;
    
    // Check 4 quadrants
    const w = img.width, h = img.height;
    const qBoxes = [
      { q: 1, x1: 20, x2: Math.floor(w/2)-20, y1: 120, y2: Math.floor(h/2)-20 },
      { q: 2, x1: Math.floor(w/2)+20, x2: w-20, y1: 120, y2: Math.floor(h/2)-20 },
      { q: 3, x1: 20, x2: Math.floor(w/2)-20, y1: Math.floor(h/2)+40, y2: h-20 },
      { q: 4, x1: Math.floor(w/2)+20, x2: w-20, y1: Math.floor(h/2)+40, y2: h-20 },
    ];
    res[name] = qBoxes.map(b => {
      let minX=9999, maxX=-1, minY=9999, maxY=-1;
      for (let y=b.y1; y<=b.y2; y++) {
        for (let x=b.x1; x<=b.x2; x++) {
          const i = (y*w + x)*4;
          const r=px[i], g=px[i+1], bb=px[i+2];
          const isGray = Math.abs(r-g)<=14 && Math.abs(g-bb)<=14;
          const matchBg = Math.abs(r-130)<=30 && Math.abs(g-130)<=30 && Math.abs(bb-130)<=30;
          if (!(isGray && matchBg)) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      return { q: b.q, w: maxX-minX+1, h: maxY-minY+1, minX, maxX, minY, maxY };
    });
  }
  document.getElementById('out').textContent = JSON.stringify(res, null, 2);
}
checkAll();
</script>
</body>
</html>
